      steward named the defect in one question: if the goal is a
      cybernetic cooperative, why is this page not queryable. The
      answer is that the surface collapsed two rules into one. The
      ledger moves by pull request, which is right, because a mark
      is an act of adoption and a human carries it. That a verdict
      must therefore go unrecorded does not follow. A verdict is
      testimony, and testimony is what a record is for. This piece
      gives testimony its rail, in the shape A-01 gave direction: a
      verb, one event kind entering by it, refusals citing their
      rules, and no widening of what anyone may read.
