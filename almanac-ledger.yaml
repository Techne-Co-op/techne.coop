# almanac-ledger.yaml · ALM v2 · Drafted
# The almanac ledger of the Common Record Series build: every piece,
# its bed, and its honest mark. ALM v2 supersedes RDM v1; the file
# answered to rdm-ledger.yaml until L-07 renamed it, and entries at
# verified or attested keep the older name verbatim, because their
# words are part of the evidence. RegenHub, LCA · July 2026
# Validator: scripts/validate.py — schema, acyclicity, proof addresses.
# Status marks: drafted | anticipated | open · (mark). A piece is
# drafted while it is an unadopted document, anticipated before anyone
# takes it up, and open once it has. The open marks say how far it has
# come: in-session while an agent is working it, delivered once its
# deliverable is merged to main, verified once a person has walked its
# acceptance, attested for a proof under two hands. An open mark that
# is none of these names the condition the piece waits on, as in
# open · Q3. Recorded 2026-08-13 by X-19, describing the usage already
# in force rather than establishing a new one; the marks had drifted
# because nothing wrote them down.
# No dates. Readiness is the schedule.

