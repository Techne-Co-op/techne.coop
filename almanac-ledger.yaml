    cites: [BP, VS]
    ready_when: L-06 merged; every page reads true first.
    deliverable: Renames landed with every reference updated in the same commit.
    acceptance: Suites green before and after; behavior identical.

  - address: L-08
    title: The quarantine
    intent: >
      Per election D5, the teeth: the retired register enters the
      style-lint vocabulary quarantine for authored prose, exactly as
      the Subchapter K quarantine works, with named exemptions for the
      concordance, quotations of historical records, and the preserved
      text of verified entries. A vocabulary evolution without teeth
      is a suggestion.
    status: anticipated
    cites: [VS, BP]
    ready_when: G-L attested; the proof precedes the teeth.
    deliverable: The style-lint suite extended, exemptions named.
    acceptance: Proven against the whole estate; every suite green.

  - address: L-09
    title: The lexicon schema
    intent: >
      The register's vocabulary as a versioned, machine-readable
      artifact. The prose page governs; lexicon.json distills it for
      any system that needs the words as data rather than paragraphs,
      and the validator holds the two in set agreement both ways, so
      a drifted artifact is a CI error rather than an export that
      quietly lies. Drawn from the federation-alignment guidance of
      2026-08-22: a vocabulary that may one day be spoken across an
      inter-network relationship needs a schema, not shared vibes.
    status: drafted
    cites: [BP, VS]
    deliverable: >
      commons/build/lexicon/lexicon.json: artifact name, version,
      governing source path, and every span.k term of the page with
      its section and a first-sentence gloss. scripts/validate.py
      gains check_lexicon_schema.
    acceptance: >
      validate.py green with the check live; removing any term from
      either the page or the artifact turns CI red; the JSON names
      its governing page and carries a version that rides the same
      commit as any vocabulary change.
    note: >
      Staged on branch L-09; merge is the act of adoption. Gloss is
      an excerpt, never a competing definition; if gloss and page
      disagree, the page is right and the artifact is the defect.

standing:

  - address: STANDING
    title: Work Standing · Module PRD and Specification
    intent: >
      The branching maturity model as record: the origin conferring
      no standing, Program standing the internal end already built
      and cited, Venture standing the external end specified for
      construction. Four principles inside the eleven laws; six
      elections staged for hands as STANDING-D1 through STANDING-D6.
      Proposal posture per its own §1; nothing adopted by drafting,
      which is the ground the steward stood on when he challenged
      P3.
    status: drafted
    cites: [SER, PRD, BP, IM, VS, AM, PATRONAGE]
    deliverable: commons/standing/index.html
    acceptance: >
      Published at techne.coop/commons/standing/. The §11 graft
      entered in this ledger; adoption is the merge, and the merge
      records the board's act.
    note: >
      v0.2 re-cuts the steward's v0.1 draft of 2026-08-09 into the
      Ground and Craft register: emissions renumbered 0021 and 0022
      (0019 and 0020 already held across the flat namespace),
      decision labels namespaced STANDING-D1..D5 against the GUILD
      module's and the lexicon bed's elections, sources re-read
      against the register of 2026-08-09.

      v0.3 of 2026-08-10 answers the steward's challenge to P3.
      v0.2 held that no object, table, or status would ever
      represent a project; the steward observed that no member and
      no board had decided that, and he was right, since the module
      is drafted and its own §1 says nothing in it is true of the
      cooperative until adoption. The principle is split. What
      carries weight, and stays absolute, is that the origin
      confers no standing and that no piece may make a project a
      precondition for posting to the board. What was withdrawn is
      the refusal of the name itself, now staged as STANDING-D6
      with its terms named and no recommendation, because the cost
      that decides it, whether naming becomes a ceremony at the
      open door, is a judgment about people and not about schema.
      §4 records the challenge rather than quietly restating the
      principle; R1 is re-cut to match.

  - address: V-01
