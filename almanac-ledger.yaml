matrix:

  # The matrix bed. Proposed 2026-08-19, not grafted by any act but a
  # merge; the intake route is the one PATRONAGE, TREASURY, AGY,
  # STANDING, and TRANSDUCER each took. Axis X is named extraction to
  # commoning by the steward's decision of the same day; the drafting
  # brief argued for predation and was overruled. Two laws bound the
  # bed and both are refusals: no surface it yields may return a number
  # about a person, and nothing in it codes a real person's conduct
  # until people have adopted the frame. A bed whose whole subject is
  # the shape of a relation is one bad build away from being a
  # reputation score, which is what these two refusals exist to stop.
  # The dependency on GUILD is real and unclosed: GUILD stands drafted,
  # its amendment unadopted and its terms unwritten, and the guild use
  # of MATRIX waits on that rather than assuming it.

  - address: MATRIX
    title: Extraction and Commoning · Module PRD and Specification
    intent: >
      The frame that lets the record say what kind of relation an event
      was: three axes and sixty-three cells, seven marks written as
      rule conditions over Ostrom's rule types rather than as
      adjectives, the cell sentence, the typed vouch edge and its
      refusal of any weight, fold semantics over an append-only log,
      decay that is presentational and never arithmetic, and three
      query rules under which no query can take an agent and return a
      number. Six non-goals are the load-bearing part. Interoperation
      is bounded to two bridges, neither on the critical path.
      Proposal posture per its own §1; nothing adopted by drafting.
    status: drafted
    cites: [SER, PRD, BP, IM, VS, L-01, TRANSDUCER]
    deliverable: commons/matrix/index.html
    acceptance: >
      Published at techne.coop/commons/matrix/. The §15 graft entered
      in this ledger; adoption is the merge, and the merge is Todd's.
    note: >
      The guild floor is not in place. The steward reports the guild
      framework was surfaced at the LCA board meeting of 2026-08-19 and
      met with forward excitement; that is a verbal report of a
      reception and not an adoption, and it is recorded here as
      exactly that so no later reading can promote it.

  - address: M-01
    title: The frame as a piece
    intent: >
      Stage 1 of five: the three axes, the seven marks with their rule
      conditions, the cell sentence, and the reading rules, standing as
      a document at an address in a bed. Drafted, not adopted. The
      whole of stage 1 is that a person can read the frame and refuse
      it before anything reads a real event through it.
    status: anticipated
    cites: [MATRIX]
    ready_when: MATRIX adopted by the steward's merge.
    deliverable: The MATRIX document at its canonical path, marked adopted.
    acceptance: >
      A person has adopted the frame and the record says who and when.
      Nothing downstream opens before that mark stands.

  - address: M-02
    title: The typed vouch as an event type
    intent: >
      Stage 2: the append-only edge citing an event, a cell, and a
      voucher, with the write-time refusals of MATRIX §6 and the fold
      of §7. The Ground already holds events and tallies, so the piece
      is small; what it must prove is the fold, not the storage. It
      also settles four things the specification deliberately left
      open: the concrete encoding and signature scheme, the per-cell
      decay horizons, who may dispute, and whether circle-held logs
      federate.
    status: anticipated
    cites: [MATRIX, IM, AM]
    ready_when: >
      M-01 stands; the edge visibility default decided by the steward,
      since it cannot be decided after the first edge is written.
    deliverable: The vouch event contract and its probe cells.
    acceptance: >
      Deleting the derived state and refolding the log from genesis
      reproduces it exactly; a query for one cell demonstrably ignores
      a heavy cell beside it; no surface returns a number about a
      person.

  - address: M-03
    title: A transducer over the graph
    intent: >
      Stage 3: a view reading the graph as edges rather than scores,
      showing its receipts, every count presented beside the edges it
      counts. TRANSDUCER v0.2 already has the shape; the current state
      of that instrument is unverified by MATRIX and the check belongs
      to this piece rather than to its readiness.
    status: anticipated
    cites: [MATRIX, M-02, TRANSDUCER]
    ready_when: M-02 verified; TRANSDUCER adopted and its state read.
    deliverable: The edge view and its refusals.
    acceptance: >
      A reader follows any edge to the event that grounds it and to the
      voucher accountable for it; an aged edge reads on its face as a
      claim about the past.

  - address: M-04
    title: Coding actual behaviour
    intent: >
      Stage 4, last on purpose: reading past events against the marks.
      Doing this before the frame is adopted would be the agent
      computing standings about real people from its own reading, which
      is the one thing this bed exists to refuse. The piece is filed so
      that the sequence is legible, not because anyone should start it.
    status: anticipated
    cites: [MATRIX, M-03]
    ready_when: >
      M-03 verified; people are reading real edges and say the reading
      is useful; a person, not the agent, authorises the coding.
    deliverable: The coding procedure walked over recorded events.
    acceptance: >
      Two people coding the same events independently land on the same
      mark, or land apart and can name the rule condition they
      disagreed about; uncodable events are recorded as uncodable.

  - address: M-05
    title: The external bridges
    intent: >
      Stage 5, optional and separable: the attestation-layer bridge and
      the arbiter role of MATRIX §13, taken at the verdicts in force.
      The scoring layer of the attestation project is out of scope
      entirely, and the arbiter role is capped at mark 4 exchange and
      below, because a lien is an exchange cell instrument. Neither is
      on the critical path and neither is funded.
    status: anticipated
    cites: [MATRIX, M-02]
    ready_when: >
      M-02 verified; the hidden RegenHub attestation network explained
      by its owners; a human decision taken on publishing edges to a
      public chain, which has no undo.
    deliverable: The bridge, read-side first, and the named arbiter.
    acceptance: >
      No score is imported and none is computed; no relation above mark
      4 is bound to encumbered capital; the fold reads chain events
      rather than an indexer's current-state rows.

  - address: SMS-01
    title: The steward's phone line answered by Nou
    verified_by: >
      Steward, 2026-08-23 (DM, "SMS-01 complete"). Two clean round trips
      landed in phone_events: "are you there?" answered 01:13:49 UTC,
      "is your SMS harness active?" answered 01:15:01 UTC, both status
      sent through Quo and both logged with the scoped phone_relay key.
      Three follow-up PRs merged the same session to get here — #237
      floor, #238 dropped the broken Quo since= param, #239 fixed the
      dispatch invocation to `openclaw agent`. Lesson written to
      memory/sms-01-smoke-test-lesson.md: a green health endpoint is
      not a smoke test; drive a real inbound end-to-end before calling
      ready.
    intent: >
      The plan at issue #191 lays out the phone channel in tiers,
      steward-only through member-with-passkey. This piece is the
      floor tier: the co-op number answered by Nou, from the
      steward's number only, read-only, over SMS. The Buzz seat's
      owner-only allowlist is the analogue; the E.164 list is the
      allowlist. Every inbound and outbound is a row on
      phone_events; nothing binds a member and no schema on profiles
      moves.
    status: open · verified
    cites: [BP]
    ready_when: >
      A2P 10DLC cleared for the line, verified 2026-08-22; the round
      trip proved end to end from the steward's number the same day.
    deliverable: >
      services/quo-relay/, a poll-mode Python service with allowlist
      gate, Nou dispatch, reply through the Quo API, and event
      logging to phone_events; migration
      commons/authority-map/0026_phone_events.sql for the sibling
      table; a webhook receiver alongside the poll for the follow-up
      merge that turns on Cloudflare fronting; systemd user unit for
      noesis; deploy and rollback notes in the service README.
    acceptance: >
      Steward texts the co-op line and receives Nou's reply within a
      minute; a non-allowlisted sender receives nothing and lands as
      an ignored row in phone_events; STOP from the steward skips
      dispatch and reply; poll mode is deployed on noesis and its
      unit stays up across restarts; no schema on profiles has moved
      and no binding table exists.

  - address: SMS-02
    title: Verified phone bindings to private Buzz channels
    intent: >
      The phone plan's second tier, designed before it is built: a
      member proves in one ceremony that they hold a phone number and
      that they hold their Nostr key, the proof becomes a binding row
      in the CIS, and from then on that number's texts arrive in a
      dedicated private Buzz channel seating exactly the member, the
      agent, and the steward. SMS proposes; nothing over SMS disposes.
      The CIS is the source of record and the relay is an
      authentication factor, per the steward's direction of 2026-08-19
      on issue #191.
    status: drafted
    cites: [SMS-01, BP]
    ready_when: >
      Design only; nothing runs. The build that follows waits on the
      phone_bindings stop card (schema against the live CIS, a named
      human) and on direction for the line to answer anyone beyond
      the steward (issue #191, open questions 2 and 3).
    deliverable: >
      commons/build/sms-bindings/index.html, the design: the
      verification ceremony, the phone_bindings sketch and its scoped
      roles, the channel-per-binding routing rule, the six-concern
      security posture, and the seams flagged as upstream Buzz
      contributions rather than forks.
    acceptance: >
      The page stands on main marked a draft adopted by nobody; no
      migration is numbered, no service is modified, no channel is
      created, and the live CIS is untouched. The design answers the
      steward's ask of 2026-08-23 in a form a builder can take up
      without re-deriving it.

  - address: SMS-03
    title: The binding ceremony built and the line widened by proof
    intent: >
      The build the SMS-02 design gated on human acts, taken up the
      same night the design merged: the steward lifted the stop card
      and directed the build (DM, 2026-08-23 04:07 UTC). The
      phone_bindings table is minted with its two scoped roles, the
      quo-relay grows the ceremony and the channel bridge, and a
      verified binding admits a number the way the hand-kept
      allowlist did. SMS still proposes and never disposes; the
      tier boundary from the design carries unchanged.
    status: open · come
    cites: [SMS-02, SMS-01, BP]
    ready_when: >
      The stop card lifted by the steward's named authorization of
      2026-08-23; the widening bounded to bindings whose ceremony
      the steward can audit end to end in phone_events and the
      relay record.
    deliverable: >
      commons/authority-map/0028_phone_bindings.sql minting the
      table, the phone_router and phone_binder roles, and their
      anchored policies; services/quo-relay/bindings.py, the
      ceremony; services/quo-relay/bridge.py, the buzz CLI hand;
      the tier-two wiring in relay.py and poll.py behind optional
      env, absent which the service runs pure tier one; eleven new
      unit tests alongside the seven that stand.
    acceptance: >
      The steward walks the ceremony from Buzz with their own
      number as the first binding: !bind sends a code over the
      line, !verify from the same key completes the binding, the
      private room opens seating member, agent, and steward, an
      SMS from the bound number lands in the room and is answered
      on both legs, a room message from the bound member goes out
      as SMS, and STOP revokes with one confirmation. Every leg
      visible in phone_events.

  - address: SMS-04
    title: The frame names who actually texted
    intent: >
      A defect found while walking SMS-03's acceptance, and live on
      the line until this packet. The relay resolved a verified
      binding in handle_inbound and then threw it away: every
      dispatch opened with the fixed string "SMS from steward",
      whoever had sent the text. A correctly bound member arrived
      wearing the steward's name, which slanders the member in one
      direction and would hand a stranger the steward's standing in
      the other. The frame is now built from what the relay actually
      knows, and it carries a third state for the case where it
      knows nothing.
    status: open · delivered
    cites: [SMS-03, SMS-02, BP]
    ready_when: >
      The defect is in shipped code and needs no human act to
      repair; the repair touches the dispatch frame only and moves
      neither the gate, the schema, nor the tier boundary.
    deliverable: >
      _sender_frame() in services/quo-relay/relay.py, three states
      and no default label: a verified binding names the member by
      the first sixteen hex of their pubkey and says the ceremony
      verified it; an allowlist match with no binding says it
      carries no key evidence; an unreadable binding directory says
      the identity is unknown rather than reporting an absence it
      never looked for. Tier stays asserted because it is a property
      of the channel; identity is asserted only where a binding
      produced one. Nine new unit tests, including the standing
      assertion that the word steward cannot appear in a frame built
      without a binding. The frame is documented in the service
      README.
    acceptance: >
      A text from a verified bound number dispatches under that
      member's key; a text from an allowlisted number with no
      binding dispatches saying so; a router outage narrows the
      frame to identity unknown the same way it already narrows the
      gate to tier one; and no frame built without a binding
      contains the word steward. The reply splitting, the gate, and
      the phone_events record are unchanged. Not fixed here and
      named as open: an SMS sender id is spoofable, so the number
      remains the whole credential behind a binding, and moving the
      ceremony to a signed-in intranet session is issue #247.

  - address: SMS-05
    title: The binding ceremony moves to the intranet
    intent: >
      SMS-03 built a ceremony that starts in a Buzz channel and anchors
      a phone number to a Nostr key. The steward's direction of
      2026-08-23 (issue #247) moves it: a signed-in member enters their
      number on the intranet, receives a code by text, and confirms it
      on the same authenticated surface, so the binding anchors to the
      magic-link session identity the record already holds rather than
      to a chat identity it cannot resolve. Issue #247 proposed the
      address SMS-04; that address was minted the same day for the
      relay dispatch-frame repair, so this piece takes the next one.
      Design and migration only; the surface is a separate UI packet
      and the apply is a named human's act.
    status: drafted
    cites: [SMS-04, SMS-03, SMS-02, SMS-01, BP]
    ready_when: >
      Design and migration only; nothing runs and nothing is applied.
      The build that follows waits on the stop card, schema against the
      live CIS by a named human, and on the three decisions the design
      stages: whether the Buzz-originated ceremony survives as a
      steward-only fallback, who holds the carrier credential that
      sends the code, and what becomes of the two verified bindings
      that anchor on keys the record cannot name.
    deliverable: >
      commons/build/sms-05-ceremony/index.html, the design;
      commons/authority-map/0029_phone_bindings_intranet.sql,
      unapplied: agent_id and origin on phone_bindings, member_pubkey
      made optional with anchor constraints in its place, the code's
      expiry and attempt budget as row state, the member-scoped read
      policies that 0026 deferred, the Supabase creation-default
      grants stripped before the first permissive policy exists, and
      three security-definer verbs through which every member write
      travels; scripts/sms05_probe.py and its sms05-ceremony CI job,
      which walks the ceremony against a scratch substrate.
    acceptance: >
      The migration applies to a fresh substrate and the probe is
      green: the two pre-existing verified bindings survive with their
      keys and keep routing, a member cannot read the hash of their own
      code, a member reads the messages inside their binding's window
      and none outside it, a direct write to phone_bindings by a member
      is refused, and a number that changes hands carries no history to
      its new holder. Nothing is applied to the live CIS by this piece.

record:

  # The record bed. Opened 2026-09-03 by the roadmap of 2026-09-02
  # (commons/build/roadmap/ROADMAP.md, batch 2), at the steward's
  # direction to orchestrate the build to public beta. Its subject is
  # the minute book: where a board meeting and its minute live in the
  # record, and how the Secretary's custody of the corporate records
  # (Bylaws v2.1 section 4.5(b)) gets a surface. The bed's first rule
  # is that it changes no schema and no policy: the events log already
  # admits an overseer to write any kind (0002, events_scoped_insert,
  # the overseer branch; unchanged by the 0024 draft), and the read
  # policies already show directors, officers, and the steward every
  # row (0002 events_read; 0005 events_steward_read). What the bed
  # adds is a place for a kind that had none. The first minutes row is
  # the Secretary's to write, not an agent's.

  - address: R-01
    title: The minute book without a schema change
    intent: >
      A board meeting's minutes get a place in the record using only
      what the record already permits. A Minutes section on the
      gatherings page lists, for every gathering whose title begins
      "Board ·", the minutes.drafted and minutes.adopted events that
      cite one of its sessions, each carrying the minute's location,
      its hash, and who adopted it. Officers, directors, and the
      steward write the two kinds from a form on the same page through
      the overseer branch of the standing insert policy. No migration,
      no policy change.
    status: open · delivered
    cites: [IM, AM, PRD, G-01, G-04]
    ready_when: >
      The roadmap's batch 1 (X-34) merged. The live events read policy
      read for overseer-written kinds, which decided the visibility
      below.
    deliverable: >
      commons/gatherings/index.html: the Minutes section, the list of
      board sessions with their minutes events, and the overseer form
      writing minutes.drafted and minutes.adopted with payload
      session_id, uri, sha256, adopted_by. This bed and this entry.
      The almanac card and the instructions' bed table row.
    acceptance: >
      An officer, director, or steward records that a minute was
      drafted, and later that it was adopted, against a board session,
      and sees both rows listed under that session with the hash they
      entered. A member who holds no office sees the section name why
      it is not shown to them. The database refuses the same write
      from a member who holds no office, with no change to any policy.
    note: >
      Visibility decided by reading the policies rather than assuming:
      events_read (0002 lines 138 to 143) shows a member only rows that
      concern them or that they wrote; an overseer's minutes row
      concerns the body, so a member cannot read it, and the section
      says so on the surface and lists nothing for them. Widening that
      is a policy change and is not this piece's. The agent_id column
      is left null on both kinds, as the AGY-ESTATE adoption event
      does (0018): the minute concerns the cooperative, not a member.
      Whether a secretary role grant exists in the live role_grants
      table is unverified here; the enum carries the office (0002
      line 22) and the client gate reads role_grants for any of the
      four overseer roles, so the surface needs no particular one.
      The first minutes.adopted row, pointing at the founding record
      of 2026-08-14, is the Secretary's act (roadmap section 4, item
      9), not this piece's. Staged on branch R-01; merge is the act of
      adoption.

  - address: R-02
    title: The record page rewired to the record
    intent: >
      The record page on the intranet stops drawing a model and reads
      the record. Three sections read live rows under the standing
      read policies and no other: the minute book from the
      minutes.drafted and minutes.adopted events R-01 gave a place,
      listed per session of every gathering titled "Board ·"; the
      offices and the roster from role_grants, each appointment with
      its holder, its date, whether it stands or ended, and whether a
      recording event stands behind it; attendance at meetings of the
      Board from attendance, per session, who was recorded present
      and by whom. The instrument table stays as a reading of the
      published documents. The GOV v0.1 parliamentary model the page
      once drew moves under a design-note heading marked drafted.
      Nothing on the page writes. No migration, no policy change.
    status: open · delivered
    cites: [IM, AM, R-01, U-05]
    ready_when: >
      R-01 merged (it was, 2026-09-03, PR 286). The read policies for
      role_grants, attendance, gatherings, and agents read for what
      each shows a non-member holder, which decided the absence
      sentences below.
    deliverable: >
      intranet/record/index.html: the three live sections, their
      absence states per reader, the instrument table with the
      Bylaws row carrying its open reading, the What is missing list
      cut to the record's own gaps, the design note holding the two
      modes, the model's cannot-hold list, and the model's open
      anchors. This entry. The almanac row and the instructions' bed
      table row.
    acceptance: >
      A director, officer, or steward signed in sees, per board
      session, the minutes rows R-01 recorded against it, the
      appointments the record holds, and the presence recorded
      against each session; a member who holds no office sees the
      appointments and their own presence and is told, in each
      section, why the rest is not shown; a signed-out reader is told
      to sign in. The page performs no insert, update, or delete
      under any reader. The design note carries the drafted mark and
      names GOV v0.1 as its source.
    note: >
      Visibility decided by reading the policies rather than
      assuming. role_grants_member_read (0002) shows every grant to a
      member and shows anyone else only the grants that name them;
      no member has been admitted (intranet legal shelf, formation
      notice), so today each officer sees their own row, and the
      page says so. attendance_scoped_read (0002) shows self,
      overseer, or host. The appointment enum (0002 line 22) carries
      director, secretary, treasurer, steward and no President; the
      page lists that as an open question and proposes nothing. No
      quorum verdict is computed: the seat count is not in the
      record and the rule is the Bylaws'. Stop card filed with the
      batch report: the formation notice in the footer reads the
      governing instruments as board-adopted, the instrument table
      reads Bylaws v2.1 as drafted and not in effect; the row is
      left as it stood with a trace naming the open reading, and the
      ruling is the steward's. Staged on branch R-02; merge is the
      act of adoption.
