    status: open · delivered
    cites: [TR-02, TRANSDUCER]
    ready_when: TR-02 verified.
    deliverable: The succession derivation in scripts/hud_cut.py.
    acceptance: >
      The recovered history of three pieces chosen by a person,
      including one carrying a backward step, matches a hand trace
      through the record; and the derivation preserves same-day
      sequences rather than collapsing them, demonstrated against
