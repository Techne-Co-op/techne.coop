  - address: X-32
    title: The walk speaks into the record
    intent: >
      The steward walked eleven cards on 2026-08-26 and the only way
      the walk reached the cooperative's record was a copy button, a
      chat message, and a person retyping it into a pull request.
      The walk surface of X-28 holds a verdict in the walker's
      browser and sends it nowhere, so a cleared tab is a lost walk
