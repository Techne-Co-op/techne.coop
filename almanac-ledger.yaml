      was raised against, the challenge held, and STANDING v0.3
      stages the question as STANDING-D6. H-1 and H-8 were re-cut
      to follow the module rather than lead it.

      Findings this piece reported against the Authority Map were
      carried unfixed until 2026-08-17, when they were written onto
      the map itself at AM v0.1 section 10 with a draft answer
      each. First: gatherings_host_write omits app_is_member() from
      its WITH CHECK, so a bound agent with no active membership can
      insert a gathering naming themselves host, against the dash in
      the section 5 applicant cell. Confirmed live in pg_policies on
      ujujwgopdwirebgcpekc the same day. Drafted, not applied, as
      commons/authority-map/0023_gatherings_host_write_bound.sql;
      0021 and 0022 are reserved for V-01 and V-02. Second: the
      probe matrix had no persona for an authenticated agent bound
      to no membership, arrival class A-5, so its refusal was
      asserted nowhere. Drafted as a second register, DRAFT_P, in
      scripts/rls_probe.py behind --drafts, outside CI.

      Third, the width 0023 named and declined to fix:
      events_scoped_insert admits any bound agent as actor for the
      signature, registration, opportunity, and gathering kind
      families without a membership test, so the applicant refused a
      gathering row could still write a gathering.scheduled event
      about a row they never made. Confirmed live in pg_policies the
      same day, verbatim against what 0002 emits. Before drafting,
      every writer of an events row was read: all but three are
      definer functions or definer triggers, which do not consult the
      policy at all, and pg_proc and pg_class read live confirm they
      are definers owned by the table owner on a table that does not
      force row security. The three client call sites write only
      gathering.* and opportunity.* kinds, and in each the actor must
      already be a member to have written the row the event concerns,
      so the narrowing costs no working path. Drafted, not applied,
      as commons/authority-map/0024_events_scoped_insert_narrowed.sql
      with seven matching DRAFT_P cells.

      The first and third findings now carry an approved direction.
      The steward, Todd Youngblood, gave it in Buzz #intranet-dev on
      2026-08-17 at 19:00:50 UTC, event
      5964c4ce86f71bac1714f55cc7683f90359a0aed86475181b2b368ce4243334e:
      narrow events_scoped_insert per kind, and hold the guest
      posture at read-only. A guest may see some privacy-aware
      records and may navigate the intranet; a guest performs no
      CRUD; public events are held on Luma, not in this record. The
      same message delegated the proceed call, and Nou exercised that
      delegated call the same day in the same thread. That pair, the
      delegation and the exercised call, is the authority the drafts
      cite; there was no board vote and none is claimed. Application
      to the live database remains Nou's act in the 0003 pattern, and
      until it happens nothing is fixed. The A-5 persona finding
      carries no direction yet and stays plainly open.

  - address: P-09
    title: The two tracks told apart
    intent: >
      Three live surfaces described the same four classes and did
      not agree. Two participation pages stood at once with
      different classes and different rates and neither said which
      governed; the word member was applied to a class the same
      page said held no vote, no capital account, no Schedule K-1,
      and no partnership under Subchapter K; agreements were
      indexed in two places and one instrument appeared on no
      index at all. This piece settles the canonical surface at
      /participation/ and makes the older path a pointer, retires
      the ladder rendering for a matrix with the membership line
      drawn across it as a line, sets the investor beside the
      whole rather than at the end of it, gives every instrument
      one shelf with a second mark answering whether signing makes
      the signer a member, restates the Participation Framework by
      track, and links the formation record as a lens from both
      surfaces. The access track gives up the word member at the
      steward's direction of 2026-08-12, on the ground that it is
      a path to membership rather than a form of it.
    status: open · delivered
    cites: [GUILD, P-06, P-08, U-13, L-01, UI]
    deliverable: >
      participation/index.html rewritten; legal/participation/
      reduced to a pointer; legal/index.html carrying the standing
      mark, the Guild Participation Terms, and the lens; the
      lexicon's member and participant entries; commons/join/ and
      the encyclopedia following the vocabulary.
    acceptance: >
      One page renders class content and the other returns a
      pointer, with no orphaned link in the repository; the four
      standing questions answer identically for every class in one
      place; no vertical price sequence and no numeric progress
      toward membership anywhere; every instrument named on the
      site appears once on the legal shelf with both marks; no
      description on the shelf enumerates classes across both
      tracks as one range; both surfaces link the Commonplace and
