transducer:

  # The transducer bed. Grafted 2026-08-17 on the steward's word of
  # the same day; adoption is the merge, per the module intake route
  # PATRONAGE, TREASURY, AGY, and STANDING each took. The module
  # document labels its pieces T-01 through T-08 document-locally;
  # the T prefix is held by the treasury bed, so the Almanac mints
  # these addresses TR, per the law that only the Almanac mints.

  - address: TRANSDUCER
    title: The Transducer · Module PRD and Specification
    intent: >
      The instrument at the boundary where the record crosses into
      human perception: the estate's own record rendered at human
      variety, five views over one dated cut, regenerated on merge
      rather than remembered. The naming supersedes the register's
      use of transducer for the tally, by the steward's direction.
      Six refusals R1 through R6 are the load-bearing part; six
      elections stand staged as TRANSDUCER-D1 through D6. Eight
      pieces and one proof; no emission, no schema, no policy.
    status: drafted
    cites: [SER, PRD, BP, UI, VS, STANDING, L-01]
    deliverable: commons/transducer/index.html
    acceptance: >
      Published at techne.coop/commons/transducer/. The §11 graft
      entered in this ledger; adoption is the merge, and the merge
      records the steward's act of 2026-08-17.
    note: >
      v0.2 of the steward's intake, drafted by the agent at his
      direction; supersedes v0.1 per its §13. Adopted by merge
      2026-08-17. Amendment A1 (the succession view) is drafted at
      commons/transducer/a1/, amending §6, §9, and §11: pieces TR-09
      and TR-10, refusal R7, decisions TRANSDUCER-D7 and D8 staged. The drafted artifact
      preceded the graft: the surface and its generator entered at
      /intranet/hud/ in the piece train merged 2026-08-17, so TR-02,
      TR-04, and TR-08 enter this bed already delivered, their
      verification still a person's walk.

  - address: TR-01
    title: The register amendment
    intent: >
      Record the §2 supersession in the Lexicon in the form
      TRANSDUCER-D1 elects, with its date and its reason, leaving
      the prior sense legible to every document that cites it.
    status: anticipated
    cites: [TRANSDUCER, L-01]
    ready_when: >
      TRANSDUCER adopted; TRANSDUCER-D1 recorded; the L bed carries
      it.
    deliverable: The Lexicon entry amended in the elected form.
    acceptance: >
      The Lexicon reads true end to end after the change, and no
      existing citation is silently altered.

  - address: TR-02
    title: The generator
    intent: >
      A script reading the repository alone and writing one cut: the
      tree with sizes, the ledger with its marks and beds, the
      history with its rhythm and the two piles, and the journeys as
      §6 defines them. No key, no clock, no author read, per R2.
    status: open · delivered
    cites: [TRANSDUCER]
    ready_when: TRANSDUCER adopted.
    deliverable: scripts/hud_cut.py.
    acceptance: >
      Run on fresh infrastructure from the public repository with no
