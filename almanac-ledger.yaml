    acceptance: Each rail's balance shows with its source and read time; the member-visible aggregate equals the sum of the reads; after T-03 the delta to the last attested window shows and links its gaps.

  - address: T-07
    title: The statements view
    intent: /intranet/treasury/ shows the cooperative's finances by month, quarter, and fiscal year, position, flow, standing, and the close ribbon, derived from the record and cut per audience, per TREASURY §9a.
    status: anticipated
    cites: [TREASURY, PATRONAGE, IM, AM, VS]
    ready_when: T-01 verified. The dues schedule recorded as an instrument for the standing region; the member-cut tally functions yielded.
    deliverable: /intranet/treasury/ statements view, the four regions and the two cuts; 000N_treasury_folds.sql, the member-cut definer tallies returning aggregates only; the close ribbon bound to attested windows; the small-cohort withholding.
    acceptance: Every figure resolves to its events, its instrument, or its read; the member cut returns no other member's name or amount under probe; outstanding equals instrument-expected minus received by hand; a month shows closed only under an attested window.
    note: >
      Staged 2026-08-05 on the steward's direction, ahead of T-01's board
      act and in T-01's own precedent: the three rail read credentials
      provisioned 2026-08-04 (the §14 item, met); 0019_treasury_statements
      applied live; the runner at scripts/treasury_statements.py; and the
      first three monthly statements, May through July 2026, rail-derived
      and rendering at the member cut on /intranet/treasury/, each marked
      provisional until a window attests. The piece still completes by
      its acceptance when the record's own tallies and instruments arrive.

  - address: T-08
    title: The program revenue registry
    intent: >
      Each Program declares named monthly subscription tiers; beside the
      registry, a store of readings says how many subscriptions stood
      active on a tier, at what price, read from which system, at what
      time, on what basis. The recurring figure at /intranet/revenue/ is
      the sum of the latest reading per live tier, and every line keeps
      the provenance the sum would otherwise destroy: live from a seam,
      or attested by a named human, marked apart, because migration into
      a system is not growth. Readings are observations beside the
      record, never events (TREASURY section 9); no money moves, no
      balance is stored (IM Law VII); Xero remains the book of account.
      Drafted at the steward's direction of 2026-08-26, the recurring
      revenue ask of the LCA finance thread.
    status: open · delivered
    cites: [TREASURY, IM, AM, BP]
    ready_when: >
      The stop card cleared on 2026-08-26: the steward directed the
      migration and 0030_program_revenue.sql was applied to the live
      CIS that afternoon. RegenHub.xyz's six tiers stand declared, four
      of them read live from Stripe by the T-09 runner. The seam this
      packet expected to wait on turned out to be open already: the
      cooperative's own read-only Stripe key sees the regenhub.xyz
      subscriptions, so no boundary had to be crossed. What still
      waits: techne.coop declares no tier until the dues schedule
      records, and the two attested tiers wait on a vouched count.
    deliverable: >
      commons/treasury/0030_program_revenue.sql, unapplied: revenue_tiers
      and revenue_readings with the creation defaults stripped at birth,
      the member read policies, the declare and retire acts writing row
      and event together, and the two folds, revenue_dashboard and
      revenue_trend; /intranet/revenue/, the dashboard, member cut with
      the registry desk for overseers.
    acceptance: >
      The monthly figure equals the sum of the by-program lines by hand;
      every line names its source, basis, and read time; an attested
      line is marked apart from a live one; a tier with no reading shows
      waiting rather than a number; the registry acts refuse a
      non-overseer under probe; the unapplied schema leaves the surface
      honest, waiting rather than guessing.

  - address: T-09
    title: The readings runner
    intent: >
      A registry with no readings is a surface that says waiting, so
      T-08's store needs a filler. The runner reads active
      subscriptions from Stripe, folds them per product, matches each
      to the tier bearing that product's name, and writes one live
      reading per tier; where no system holds a count, it writes an
      attested reading and refuses to write one without the name of
      the human vouching it. It writes to the readings store and
      nowhere else: it declares no tier, retires none, moves no money,
      and stores no balance. A Stripe product with no tier and a tier
      with no product are both reported and neither is invented,
      because a forgotten declaration and an unread tier are signals
      worth seeing rather than gaps worth filling.
    status: open · delivered
    cites: [TREASURY, IM, BP]
    ready_when: >
      Delivered and run against the live CIS on 2026-08-26. What the
      runner still cannot reach: the maker node and the unmigrated
      legacy memberships, which no system holds, so both tiers stay
      unread until a named human vouches their counts. Aaron Neyer
      reported 850 and 750 per month respectively on 2026-08-25, and
      those figures are deliberately not written as readings, because
      the live Stripe total of 1,650 does not reconcile against the
      1,050 reported the same evening and writing both would risk
      counting the same members twice.
    deliverable: >
      scripts/revenue_readings.py, with --live for the Stripe seam,
      --attest with a required --voucher for counts no system holds,
      --show for the fold as it stands, and --dry-run throughout.
    acceptance: >
      A dry run names each tier, its count, and its monthly figure and
      writes nothing; a live run writes one reading per matched tier
      and the fold's total equals the sum of its lines; an attested
      reading without a voucher is refused; an unmatched Stripe
      product is reported and skipped; anon is refused on both tables
      and on both folds through the public API.

shell:

  # The U bed: the frame every capability shares. Refiled here 2026-07-27 (X-13);
  # these pieces had accreted into the share and treasury sections, and the
  # section keys are part of the ledger's legibility even where the validator
  # reads them flat.

  - address: U-01
    title: The shell
    intent: >
      One persistent frame over every signed-in surface. assets/shell.js
      injects the topbar, the complete grouped map of the intranet, the
      member chip, the mode toggle, and a section context strip, all read
      from a declared manifest that names each section's slice, tint,
      grammar, and reads. Cross-document view transitions make navigation
      change only the primary view while the frame holds. Fulfils and
      supersedes the nav.js behaviour the design-system reference
      specified but never received.
    status: open · verified
    cites: [UI, PRD, BP]
    ready_when: The shared-script emission card below decided by the steward.
    deliverable: >
      assets/shell.js, dependency free; adoption on /intranet/,
      /intranet/programs/, and /intranet/treasury/; the section manifest.
    acceptance: >
      The three intranet pages present one identical frame; the active
      section marks from the address; the member chip reads the session
      without a second auth client; style-lint and the token audit green.
    note: >
      Build staged 2026-07-24 on branch U-01. The packet opens when the
      steward decides the emission card and merges; held at anticipated
      per the X-09 convention for work staged ahead of its decision.
    resolution: >
      Delivered as staged and merged as PR 51, 2026-07-24, the merge
      deciding the emission card below. Acceptance shown by headless
      render: one identical frame on the three intranet pages, the
      active section marked from the address, the member chip reading
      the stored session without a second client; style-lint and the
      token audit green in CI. Verified by Todd Youngblood 2026-07-24.
    escalation:
      standing_in: U-01, the shared-script emission question.
      found: >
        The SUB-02 consumption card sanctioned inline CSS per page and
        stayed silent on scripts. The design-system reference promises a
        shared, self-injecting /intranet/nav.js that was never built;
        instead seven signed-in pages each hand-roll a topbar, a mode
        toggle, and a magic-link gate, and no two topbars list the same
        siblings. Only /intranet/ carries the complete map.
      the_question: >
        Does one shared script count as a sanctioned emission on site
        pages, or does the self-contained-page rule extend to scripts?
      a_default: >
        Sanctioned. One dependency-free file, no build step, no
        framework; the page remains a readable document that works
        without it. The precedent is assets/error-boundary.js, already
        shared across the four interactive surfaces under X-01. CSS
        stays inline per SUB-02; the shell carries only its own frame
        styles inside itself.
      decision: >
        Default adopted by Todd Youngblood 2026-07-24 by merge of PR 51:
        one shared, dependency-free script is a sanctioned emission on
        site pages; CSS stays inline per SUB-02. UI v1 section 9
        carries the record (U-03).

  - address: U-02
    title: The doors adopt the frame
    intent: >
      The four commons doors, agreements, directory, gatherings, and
      opportunities, shed their hand-rolled topbars and stand inside the
      shell, so the whole signed-in surface reads as one instrument. The
      Overview page re-bases on the canonical token set and chip
      vocabulary while its bespoke copies retire.
    status: open · verified
    cites: [UI, PRD]
    ready_when: U-01 verified.
    deliverable: >
      Shell adoption on the four door pages; the Overview re-based on the
      design-system chip vocabulary with its unused slice-chip classes
      removed.
    acceptance: >
      All seven signed-in pages present one identical frame with correct
      active marks; no page carries a private topbar; the token audit
      stays green.
    note: >
      Build staged 2026-07-24 on branch U-02, stacked on U-01.
    resolution: >
      Merged as PR 52, 2026-07-24. All seven signed-in pages render the
      one frame with correct active marks, shown by headless render; the
      Overview's dead vocabulary retired; token audit green in CI.
      Verified by Todd Youngblood 2026-07-24.
