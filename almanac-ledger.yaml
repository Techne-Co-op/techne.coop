      standing_in: F-05, the shape of a Program at designation.
      found: >
        The steward asked for a basic Program schema that can be extended
        later. Two shapes are available. PATRONAGE section 4 already makes
        a Program an agent, and section 7 already puts its substance,
        purpose, Coordinator, active Primitives, weights, funding bounds,
        in the payload of its POLICY-PATRONAGE adoption event, which 0010
