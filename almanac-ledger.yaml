    note: >
      A near miss worth the record. The first pass replaced each
      page's strip CSS by splicing from the strip's comment to the
      next </style>, which on legal/corrections/index.html deleted
      ninety-two lines of that page's own stylesheet and left it
      rendering as unstyled text. The audit passed anyway, because
      an audit that checks for a string cannot see a page that has
      stopped working. It was caught by rendering the page and
