    status: open · delivered
    cites: [TR-04, TRANSDUCER]
    ready_when: TR-04 verified; TRANSDUCER-D5 recorded.
    deliverable: The walk, inside intranet/hud/index.html.
    acceptance: >
      A person who has never seen the estate can, after the walk
