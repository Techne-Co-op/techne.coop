governance:

  - address: ROO
    title: Rules of Order, the survey
    intent: >
      What already governs a RegenHub meeting and what only seems to:
      the quorum, the vote, the notice rule, the presumption of
      assent, and the order of business the Bylaws supply for
      membership meetings only. Robert's Rules explained for someone
      who has never used it, proposed as a gap filler, with the
      motion the board would have to pass.
    status: drafted
    deliverable: commons/governance/rules-of-order/index.html
    acceptance: >
      The page states what the Bylaws require and what they omit, and
      proposes adoption text; adoption is a board act.
    note: >
      Two drafting defects recorded against the Bylaws and neither
      fixed: the interested-director citation pointing at Article XVI
      where the substance is Article XVII, and the Board chair office
      named in 3.16.5 that the Bylaws nowhere create.

  - address: ORDER
    title: The Order of Proceeding
    intent: >
      Twelve rules in four movements, evolved from the cooperative's
      own record rather than adopted from Robert: the record opened
      by spoken consent, the kind of gathering named, the standing
      read, the floor asked for with a time and yielded aloud, plain
      speech as an entitlement, silence as a posture and its hard
      boundary at 3.16, one question read back, consent with an
      objection that names its harm, simulation before adoption, an
      arbiter and an exit before anything binds, correction as a new
      act, and a close that names what was decided, what was only
      said, and what waits on a condition.
    status: drafted
    cites: [ROO]
    deliverable: commons/governance/order-of-proceeding/index.html
    acceptance: >
      Twelve rules, each traced to a source in the record or marked
      as judgment; the board has three named options and has taken
      none.
    note: >
      A verified finding enters with the piece: the parliamentary
      omission goes back to counsel's original draft. Bylaws v.1
      carries no parliamentary-authority clause either, and its 2.10
      Order of Business is the same twelve steps that survive into
      v2.1. The gap was not introduced by the organizers' revision.

  - address: EGRESS
    title: The Egress Doctrine, one record and a tiered read
    intent: >
      The rule for what leaves the cooperative: the full record
      belongs to the inner body, a defined public digest belongs to
      the outer body, and a written rule over two axes, rights class
      and content class, decides which subset departs, at what grain,
      under what license class, through which named door. Corrections
      propagate outward through the same door at the same grain.
      Implements the inner and outer frame of issue 217 per the
      guidance of issue 218; both are the public anchors and the page
      cites them.
    status: drafted
    cites: [BP, IM, AM, PUB, ORDER]
    deliverable: commons/governance/egress/index.html
    acceptance: >
      The page states whose the record is, whose the digest is, the
      two-axis rule with deny by default, the four grains, the named
      doors, and the outward correction discipline; it labels itself
      a draft and names the elections it leaves to the adopter.
      Adoption of the doctrine is a human act and the page says so.
    note: >
      Staged on branch EGRESS; merge is the act of adoption. Drafted
      2026-08-22 under Grant 003. The merge adopts the draft into the
      estate; the doctrine binds only when a person with standing
      adopts it, and the page holds that boundary itself.

