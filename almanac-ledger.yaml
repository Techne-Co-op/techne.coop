  - address: TR-10
    title: The seam
    intent: >
      The succession view inside the shell, marks per the colour law
      of A1 section 6, the revision count named on the surface per A1
      section 5. Dwell is elapsed days and never an alarm, per R7:
      no threshold at which a piece becomes late, because there is no
      promise it was late against.
    status: open · delivered
    cites: [TR-09, TR-04, TRANSDUCER]
    ready_when: TR-09 verified; TR-04 verified.
    deliverable: The succession lens of intranet/hud/index.html.
    acceptance: >
      A reader can find the flat layer without being told it is
      there, and can say from the panel alone what the backward
      steps were.

  - address: TR-11
    title: The landscape a person can find themselves in
    intent: >
      The lens rail was ordered by the layers the instrument is built
      from, the file, the record, the commit, and it opened on the
      cross-section. That is the order a builder reads and not the
      order a member reads. This piece reorders the views by their
      legibility to the member body and opens the surface on the
      journeys lens, so the first thing any participant meets is the
      landscape they stand in rather than an abstraction of the
      infrastructure. The material lens, the files, goes last: it is
      the layer a reader may leave without.
    status: open · delivered
    cites: [TR-04, TR-08, TRANSDUCER]
    ready_when: TR-04 delivered; the journeys lens on the surface.
    deliverable: >
      The reordered lens rail and the journeys lens of
      intranet/hud/index.html: a where-you-stand row of the arrival
      classes in the participation record's order, the chosen walk
      brought forward while the others stay visible, and the guided
      walk opening on the same landscape.
    acceptance: >
      A participant of any class, guest to patron member, opens the
      surface and finds their own way in named in the first view
      without being told where to look, and reads their walk and its
      stop from that one choice.
    note: >
      Entered 2026-08-19 at the steward's direction in intranet-dev.
      The split between a way in and a reading across the classes is
      derived, not typed: a passage that walks none of its own
