  - address: TR-03
    title: The currency gate
    intent: >
      The generator wired into continuous integration on merge to
      main, with the §5 audit: fail if the embedded cut is older
      than the commit it sits beside, on the X-10 pattern. The
      gate's own refresh commits are marked and the generator
      ignores them, and the page's size is recorded net of the cut
