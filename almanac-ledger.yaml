      events_read seats there, every section honest about its empty state
      and naming the emission that will fill it. TREASURY-POLICY v1 is
      drafted and staged to the FSC and the board at
      commons/treasury/policy/ with the §6 floor and the drafter's band
      cut. The piece completes when the board adopts: the agreements row
      enters, the adoption event carries the payload, and the thresholds
