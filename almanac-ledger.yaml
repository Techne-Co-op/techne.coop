      the dated source citations of the transducer pages keep the older
      names verbatim, and the concordance carries both renames. The
      transducer currency workflow keeps its committer identity, the
      currency gate, because it is written into commit history.
      Standing for the steward: the required status checks on the
      protected branch name the job gate-rehearsal, which is a
