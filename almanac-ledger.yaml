  - address: U-18
    title: The frame that never held
    intent: >
      U-01 specified one persistent frame carried across navigations
      by cross-document view transitions, and the design system and
      the UI inventory both said so. It was never true. The opt-in,
      @view-transition, lived inside a stylesheet the shell injected
      on DOMContentLoaded, and the browser reads that opt-in at
      pagereveal, which precedes every deferred script. The new
      document had therefore not opted in at the moment of the
      question, so every transition on this estate was skipped from
      the first day, and every skip rejected with an AbortError the
      error boundary faithfully recorded as benign on every single
      navigation. The steward read those lines in the console on
      2026-08-09 and asked why the intranet reloaded between pages.
      It reloaded because it was reloading: nothing persisted, the
      frame was rebuilt from an empty body each time, and the console
      had been saying so all along. This piece makes the frame's
      appearance load with the document, so the transitions run, and
      tells the browser where the map leads, so the next surface is
      fetched before the click rather than after it.
    status: open · delivered
    cites: [U-01, U-15, UI, X-01]
    ready_when: U-17 merged.
    deliverable: >
      assets/shell.css carrying the frame's appearance and the
      @view-transition opt-in, linked in the head of all eleven
      surfaces the shell frames and ahead of the deferred script;
      the CSS string removed from assets/shell.js; speculation rules
      emitted from the shell's own manifest at moderate eagerness for
      signed-in members, deferred while a document is itself being
      prerendered; scripts/token_audit.py widened to assets/*.css so
      the move does not carry the frame's colours out of coverage;
      the false claim corrected where the estate made it, in
      design-system/ and commons/ui/.
    acceptance: >
      A measured navigation between two members' surfaces reports a
      view transition present at pagereveal and no AbortError, where
      the same measurement before the change reported neither
      transition nor frame; the hex discipline still runs over the
      frame's colours; and no page states that the frame holds across
      a navigation, which it does not yet do.
