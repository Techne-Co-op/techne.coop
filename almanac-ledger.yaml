  - address: TR-09
    title: The succession derivation
    intent: >
      The generator walks every revision of the ledger, recovers each
      piece's observed states in order under the discipline of A1
      section 3, and writes them into the cut. Every distinct state a
      piece is observed to hold, including several on one date, in
