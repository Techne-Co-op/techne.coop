    resolution: >
      Merged as PR 56, 2026-07-24, and deployed; headless renders showed
      the identical card with tinted destination lines on overview,
      agreements, and programs, no map signed out, and the signed-in
      frame unchanged. One beat remains live: the steward's next real
      sign-in through the gate, magic link sent and landed, which is why
