  - address: X-20
    title: The ledger reads the build
    intent: >
      Every field in a ledger entry is addressed to a human reader.
      The status is a hand-typed string, the deliverable is prose
      that sometimes happens to contain a path, the acceptance is
      prose. Nothing in an entry can be evaluated by anything, so
      every mark is an assertion, and an assertion nothing checks
      drifts: X-19 found twenty-four wrong marks in a hundred and
      twenty-two entries, about one in five, and none had been
      noticed for days. X-18 gave the page teeth against the ledger
      and the ledger teeth against the repository, and both of those
      checks still read what a person typed. The lexicon reads this
      build as a viable system, where the verification suites audit
      the machine and the signal loop asks what is workable and what
      has stalled quietly. Nothing audits the record of the machine.
      The lexicon calls the tally the transducer, the reading by
      which the system knows its own state from its own history, and
      that transducer is a person retyping. This piece proposes to
      close the loop: the ledger stops being an open-loop report
      about the build and becomes an instrument that reads it.
    status: anticipated
    cites: [BP, VS, L-01, L-03, X-18, X-19]
    ready_when: >
      X-20-D1 recorded. The piece changes the ledger grammar, which
      is schema, and so is Tier B under BP section 6: organizer
      review plus a decision record where the change is new. Not
      before launch. X-18's own argument, that a new gate in launch
      week is a hazard rather than a safeguard, applies to a new
      schema with more force.
    deliverable: >
      A schema change to almanac-ledger.yaml splitting status into two
      fields of different authority, an optional evidence block
      beside the prose, a reconciler under scripts/, and the signal
      loop's stall panel computed rather than curated. The declared
      field stays a person's, holding drafted, anticipated, and the
      gated marks that name a condition, because those are
      intentions and commitments and only a person can say them.
      The observed field is computed on every run: in-session,
      delivered, verified, attested. The evidence block is what
      makes the second computable, naming for an entry the paths
      whose presence on main means delivered, the verification probe
      whose green means verified, the agreement whose adoption opens
      a gate, and the proof row whose two hands mean attested. The
      reconciler computes the observed column and reports where it
      disagrees with the declared one.
    acceptance: >
      The reconciler runs over the whole ledger and reports no
      disagreement it cannot explain; the twenty-four marks X-19
      corrected by hand are derivable from evidence blocks without a
      hand; a piece merged without its mark moved is reported by the
      next run; a piece standing in session with no commit on its
      branch is reported as a stall; and the reconciler reports for a
      stretch before it gates anything.
    escalation:
      standing_in: >
        The steward's question of 2026-08-13: whether the ledgering
        system can be evolved so that the commons reads as a living
        system rather than a filed one, given that work and record
        appear to take two pull requests.
      found: >
        The two-pull-request account is not this estate's rule. BP
        section 6 says one piece per branch and every status change
        is a commit, so the history is the audit; ten of the last
        twelve merges carried the ledger update inside the work pull
        request. The two that did not, FORMATION-01 and DOC-01, were
        the two pieces that had no ledger address at all, and PR 127
        exists only because of them. A second pull request is not a
        protocol requirement, it is what happens when the work forgot
        the record. The defect underneath is that nothing can tell:
        the record is a report written by hand about a machine that
        never reads it back.
      the_question: >
        Does the ledger grammar gain a computed column, so that a
        mark is derived from evidence rather than typed, and the
        record becomes a closed loop?
      a_default: >
        Yes, and reporting long before gating. The declared column
        gets more meaningful rather than less, because what stays in
        a person's hands is exactly the part only a person can say,
        and the second pull request disappears for everything
        derivable, since merging the work moves the observed column
        because the world moved. Three consequences follow that the
        estate would feel: stalls become computed rather than
        curated, which is why seventeen marks sat stale for days
        while the panel that exists to notice stalls said nothing;
        the build page could say one of nine attested because it
        counted rather than because an agent typed one; and the
        ledger would learn from the live record as well as from the
        repository. Today the two audits read the repository and the
        probes read the record, and nothing reads both.
    note: >
      Filed at the steward's word, 2026-08-13, as the address for the
      answer to his question rather than as work taken up. Three
      calls are the agent's and can be overturned. First, the piece
      is filed anticipated and deliberately not started, because it
      changes schema in launch week. Second, two disciplines are
      written into the deliverable rather than left to whoever builds
      it, because they are the parts most likely to be dropped under
      time pressure: the reconciler reports before it gates, since a
      hand-typed mark is wrong in one place while a wrong derivation
      is wrong everywhere at once and silently, which is the lesson
      P-12 taught when every audit passed green over a page that had
      stopped rendering; and no machine writes to the ledger, ever,
      because a record a machine writes to has stopped being an
      audit. Third, the escalation card is left unresolved on
      purpose. An agent may draft the brief and may not record the
      outcome, per BP section 4, and this one is Tier B twice over,
      touching the grammar of the record and the division of what a
      person says from what a machine derives.

