      Poll, brief, isolated session, scope enforcement, halt, spend
      write-back per AGY §6 §7 §10.
    status: anticipated
    cites: [AGY, BP]
    ready_when: A-03 verified. Rehearsed on the steward's Directions before any member's.
    deliverable: The harness on the host; the halt path demonstrated.
    acceptance: >
      A Direction completes end to end with both trailers and its spend
      recorded.
    note: >
      Staged 2026-07-27 on branch A-04, ahead of its readiness condition
      and held at anticipated per the X-09 convention for work staged
      ahead of its decision. The piece opens when the grant lands
      (A-03), not when this branch merges. Staged here: RUN.md, the
      brief a Run is opened with, distilled from AGY §7 and §11;
      scripts/rail_poll.py, the queue read of AGY §6, read-only by
      design and exercised against the live rail the day the rail
      landed. Not staged, and named so the gap is not mistaken for an
      oversight: the isolated runner identity and its sandbox, which is
      a Gateway configuration change on the steward's host and his to
      approve; and every agent-actored write, which waits on the grant.
      Until then the R0 form of AGY §12 operates, the harness preparing
      a close that a human hand writes. The steward's own Direction of
      2026-07-27 (d6e22f76) stands as the rehearsal subject this
      piece's readiness condition asks for.

      One finding from staging, and it bears on the piece's shape.
      The poll was written as a scheduled job with its tool policy
      narrowed to the shell alone, and the Gateway refused to run it:
      the claude-cli backend cannot enforce a runtime tool allowlist,
      and says so rather than running unrestricted. The job is
      recorded and left disabled. This is the right refusal, and it
      settles a question the piece had left implicit: on this
      runtime the Run's bounds could only ever be instruction, and
      AGY §7 requires construction. The harness therefore needs an
      embedded runtime and a sandboxed runner identity before it may
      run at all, which makes that step blocking rather than a later
      refinement. It is a Gateway configuration change on the
      steward's host, and his.

lexicon:

  # The lexicon bed: the evolved register of the build. Entered
  # 2026-08-08 on the steward's adoption of Ground and Craft, the
  # migration specification, with elections D1 through D5 at their
  # defaults. Supersedes The Register Bridge (X-15), which under-read
  # the direction by holding the primary terms fixed. Pieces run
  # strictly in order: L-01 merges before anything else, because the
  # Lexicon governs and its yields distill. One law bounds the bed:
  # history is not editable. Entries at verified or attested, event
  # payloads, commit history, and quoted records keep the retired
  # register verbatim; the concordance is the reader's bridge.

  - address: L-01
    title: Lexicon v2
    intent: >
      The register section of Ground and Craft becomes the canonical
      Lexicon at commons/build/lexicon/: the two-roots preface, the
      cybernetic spine, the full definitions of the evolved register,
      and the concordance table that keeps the history readable
      forever. The ground root gives the words for where work grows
      and how it joins; the craft root gives the words for what hands
      make and how it is proven.
    status: open · delivered
    cites: [SER, BP, VS]
    ready_when: >
      Ground and Craft adopted by the steward with elections D1
      through D5 recorded. Adopted 2026-08-08, all defaults elected.
    deliverable: >
      commons/build/lexicon/index.html rewritten as Lexicon v2; the L
      bed and its proof G-L entered in the ledger.
    acceptance: >
      Every working term is defined, every retired term answers
      through the concordance, and style-lint is green.

  - address: L-02
    title: The Almanac
    intent: >
      commons/build/index.html rewritten end to end in the register:
      title, code, eyebrow, dek, tab labels, bed headers, captions,
      condition cards, loop prose, the tree panel labels, and the
      footer lineage recording that ALM v2 supersedes RDM v1. The
      generated counts block and its comment markers untouched; meta
      descriptions follow the page.
    status: open · delivered
    cites: [SER, BP, UI]
    ready_when: L-01 merged; the Lexicon governs before the pages speak it.
    deliverable: commons/build/index.html as the Almanac, ALM v2.
    acceptance: >
      No retired term appears outside quotation of historical records,
      and every suite is green.

  - address: L-03
    title: The ledger speaks
    intent: >
      The almanac ledger's own voice moves to the register: header
      comments, section keys, the self-describing entries, and the
      intents of pieces still open or anticipated, with the
      validator's section handling and its proof-address constant
      updated in the same commit (the constant also gains G-A, which
      the agency graft created and the constant missed, and G-L),
      behavior identical, suites proving it. The law of this piece:
      entries at verified or attested keep their text verbatim,
      because their words are part of the evidence; only the file's
      present voice evolves.
    status: open · verified
    note: >
      Verified in the recorded verification walk of 2026-08-26 (walk 02, Todd
      R. Youngblood, spoken verdict: holds; record archived in the cooperative
      workspace as MEETINGS/2026-08-26_cis-verification-walk-02_todd.md). The
      walker said: "T-09: the readings runner, and T-08's registry filled
      checks green"
    cites: [BP, VS]
    ready_when: L-02 merged.
    deliverable: rdm-ledger.yaml and scripts/validate.py, evolved together.
    acceptance: >
      ledger-validate green and no verified or attested entry differs
      by one byte.

  - address: L-04
    title: The companions
    intent: >
      The Proof Book, wearing its new name, the Run-Through, the
      instructions, and the launch page re-worded to the register.
    status: open · delivered
    cites: [BP, VS]
    ready_when: L-03 merged.
    deliverable: >
      commons/build/gates/, commons/build/run-through/,
      commons/build/instructions/, and commons/build/launch/ revised.
    acceptance: >
      The four pages and the Almanac agree word for word on every
