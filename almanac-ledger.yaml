  - address: B-08
    title: Comment and countersign
    intent: >
      The agreements bed gains two acts. A member may leave a recorded remark
      on a versioned instrument, in their own name, never edited and withdrawn
      only by a citing row. A signature may carry the date the signer attests
      to and the capacity they sign in, distinct from the moment the record was
      written.
    status: drafted
    cites: [IM, AM, PRD, B-03, B-04, B-07]
    ready_when: >
      B-07 verified. Asked by Todd Youngblood in the cooperatives channel
      2026-08-19, alongside entering the Gitcoin statement of work on the
      shelf: an agreement that is negotiated rather than adopted needs a place
      for what was said about it and a date the parties name.
    deliverable: >
      commons/authority-map/0025_agreement_comments_and_dated_signing.sql
      (the agreement_comments table with reply and withdrawal citations held to
      one instrument by trigger, RLS granting read to active members, directors
      and officers and insert only in the caller's own name with no update
      policy at all, the comment_on_agreement definer function parallel in
