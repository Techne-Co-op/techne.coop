      signed events over a relay the cooperative operates, an outer
      commons on a public portable-identity protocol, the Egress
      Doctrine deciding what crosses, the two rings joined at the
      organizational layer rather than at the wire. Four horizons in
      the order that unlocks them: prove the inner-ring seam, make
      the vocabularies machine-readable and map rather than merge,
      state egress and then stand up the outer commons, and portable
      member identity. Then the part the Commonplace has no reason
      to carry: what changes for the member and what does not, with
