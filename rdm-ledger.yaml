      Build staged 2026-07-24 on branch U-01. The packet opens when the
      steward decides the emission card and merges; held at anticipated
      per the X-09 convention for work staged ahead of its decision.
    resolution: >
      Delivered as staged and merged as PR 51, 2026-07-24, the merge
