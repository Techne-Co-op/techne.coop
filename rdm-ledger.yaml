  - address: B-06
    title: Member profile
    intent: The directory profile grows beyond a name, on the steward's composition.
    status: open · verified
    cites: [IM, AM, PRD]
    ready_when: B-05 verified.
    deliverable: >
      profiles table (0009_profiles.sql, AM §9 addendum) and the directory
      surface reading and writing it: avatar image, bio, links, location,
      pronouns, and an email whose visibility the owner controls.
    acceptance: >
      A member fills their profile and sees it on their card; another member
      sees the email only when the owner has said so; the record-derived
      activity strip renders without any declared crafts field.
    resolution: >
      Verified by the steward's run-through, 2026-07-24: the profile stands in
      the live record (one profiles row against the steward's agent), edited by
      its owner alone. Recorded with the launch-readiness pass.
    note: >
      Composition decided in conversation with Todd Youngblood 2026-07-22:
      images, bio, links, location, pronouns (optional), email
      (visibility optional); profile updates are NOT evented, presentation
      state by decision; crafts are not declared but inferred from
      contributions and patronage activity in the profile view (the record
