horizon:

  # The horizon bed: the cooperative's legal shape over time, held
  # deliberately apart from the instruments it sits beside. Entered
  # 2026-08-10 at the steward's direction, from two artifacts of his
  # own hand. One law bounds the bed: nothing in it governs. The
  # maturity model is research for member deliberation and would take
  # effect, if ever, only by member vote under the amendment
  # procedures of the Bylaws, on counsel's advice. A page that reads
  # like an instrument and is not one is the failure this bed exists
  # to prevent.

  - address: MM
    title: Maturity Model 0.2 and its companion
    intent: >
      The cooperative's possible growth stated twice, in two
      registers. The companion page says in plain words that a legal
      entity is a container and not an identity, and sketches three
      stages: the partnership that exists, a sibling cooperative for
      ventures, and a purpose trust that would keep the promises. The
      specification states the same model precisely: vessels, six
      invariants that must hold in every vessel, two transitions with
      their readiness conditions and procedure, and the record
      requirements that keep several entities one system. Only V1
      exists. V2 was deferred by design during formation. V3 is an
      inference from the formation record and says so on its face.
    status: drafted
    cites: [L-01]
    deliverable: >
      legal/maturity-model/index.html and
      legal/maturity-model/specification/index.html.
    acceptance: >
      Both published, each stating on its own face that it is
      drafted, unadopted, and not a governing instrument or advice,
      and the /legal/ index holding them apart from the instruments.
    note: >
      The steward's artifacts, brought into the estate by MM-01 with
      two meta-tag em dashes retired and nothing else altered.

  - address: MM-01
    title: The horizon enters the shelf
    intent: >
      The two pages placed at their canonical paths and a Horizon
      section entered on /legal/, carrying both under a note that
      says what they are not. Placed after the analysis group, so a
      reader meets the instruments, then their readings, then the
      model, in that order, and never mistakes the third for the
      first.
    status: drafted
    cites: [MM]
    deliverable: >
      legal/maturity-model/, legal/maturity-model/specification/,
      and the Horizon section of legal/index.html.
    acceptance: >
      Both pages render at their canonical paths; /legal/ links both
      under a note stating they are unadopted; the validator's one
      navigation check passes on the new pages; style-lint and the
      token audit are green; the Almanac carries a card for each new
      address.
