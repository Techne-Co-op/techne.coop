  # migration specification, with elections D1 through D5 at their
  # defaults. Supersedes The Register Bridge (X-15), which under-read
  # the direction by holding the primary terms fixed. Pieces run
  # strictly in order: L-01 merges before anything else, because the
  # Lexicon governs and its yields distill. One law bounds the bed:
  # history is not editable. Entries at verified or attested, event
  # payloads, commit history, and quoted records keep the retired
  # register verbatim; the concordance is the reader's bridge.

