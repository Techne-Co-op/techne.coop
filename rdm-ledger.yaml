        Proposed: the agent row and the event, no new table. Identity
        lives in agents by Law I, and a second table would be a second
        truth to keep in step. Designation therefore carries only name and
        purpose, which is what a Program has before any policy governs it;
        every later field arrives in the adoption payload with no schema
        change, which is the extension the steward asked for.
