    acceptance: >
      Adding a column to a base table without refreshing its export view
      fails CI; the walkaway carries every column the record holds.
    note: >
      Found 2026-07-27 while verifying G-04's migration against the live
      database: public.gatherings had the two new columns and
      export.gatherings still had the old five. An export and restore would
      have returned every gathering without its purpose or its place,
