      (access and patron); the invitation pathway from the access
      track to membership. Two elections staged for the board:
      GUILD-D2, the invitation count (two drafted, the board may set
      three); GUILD-D5, the public name. The amendment and the Guild
      Participation Terms are people's writing; the agent stages the
      shelf they rest on. Nothing adopted by drafting.
    status: drafted
    cites: [SER, PRD, BP, IM, VS, AM]
