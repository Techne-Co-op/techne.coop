  - address: X-12
    title: The member's rail
    intent: >
      Law I holds that every relationship between records is itself an
      event, yet a response landed as a row alone and a registration never
      spoke at all: the author learned nothing unless they went and looked,
      and the host counted heads by refreshing. Two definer triggers land
      the relationship in the log addressed to the member it concerns, the
      shell renders that address as a notices panel, and the notices
      function gains the away-channel half, dormant until the sending
      domain verifies.
    status: open · in-session
    cites: [IM, AM, VS]
    ready_when: F-02 delivered; G-04 in session; X-02 verified.
    deliverable: >
      0015_member_notices.sql (the triggers); the shell's notices panel
      (U-01 extension); 0016_notices_rail_kinds.sql and the notices
      function's member routing (dormant, X-02 sink pattern); replica-mode
      import (import_cis.py); rehearsal beats 7.3, 7.4, 10.3, 10.4.
    acceptance: >
      A response or a registration turn lands as an event addressed to the
      member it concerns and to no one else; the member sees it in the
      shell without going to look; a restore replays the log without
      minting new notices.
    note: >
      Found in the launch-gap review 2026-07-27: the record heard these
      acts but told no one. No policy changes anywhere; events_read has
      scoped an agent to what concerns them since the substrate, and the
      rail rides that standing authority. The notice is renderable from
      the event alone, the payload carrying name and title at the moment
      of the act as 0007 and 0013 already practice. Unseen state is a
      device-local cutoff, never state the record carries.

