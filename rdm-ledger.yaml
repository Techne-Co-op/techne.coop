      email cell is column-guarded: no client select carries it, and
      profile_email() serves it on the owner's terms to active members
      only. Avatars live in a private storage bucket under self-write,
      member-read policies; the storage half of 0009 guards on the storage
      schema so CI substrates apply clean. Walkaway boundary, held openly:
      profiles and avatar objects are not yet in the X-03 export set;
