    status: anticipated
    cites: [AGY, BP]
    ready_when: A-03 verified. Rehearsed on the steward's Directions before any member's.
    deliverable: The harness on the host; the halt path demonstrated.
    acceptance: >
      A Direction completes end to end with both trailers and its spend
