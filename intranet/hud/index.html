/* ============ 00 · JOURNEYS · where you stand ============
   Built to JOURNEYS v0.1 (drafted, not adopted). The register it
   specifies does not exist yet, so this view reads the stories
   page as found and derives only what can honestly be derived
   today: the stop, by walking each passage until a step is not
   live. The condition rule of §5, which reads each step's cited
   Almanac addresses, waits on pieces J-01 and J-02. Where a
   figure here is hand-typed rather than computed, the view says
   so rather than implying a derivation it cannot perform. */
function viewJourneys(c){
  const J=SNAP.journeys, steps=J.steps, ps=J.personas;
  const all=Object.values(steps);
  const cnt=s=>all.filter(x=>x.state===s).length;
  const reach=p=>{ let n=0; for(const id of p.passage){ if(steps[id]&&steps[id].state==='live') n++; else break; } return n; };

  /* An arrival class is a passage that walks at least one of its own
     section's steps. A passage made entirely of other sections' steps
     is a reading across the classes, not a way in; H is the case. The
     split is derived here rather than typed, and the order is the
     stories page's own order, which runs from the stranger at the door
     inward to the patron member. It is a landscape, never a ladder. */
  const letter=p=>(p.sec.split(' \u00b7 ')[0]||'').trim();
  const own=p=>p.passage.some(id=>steps[id]&&letter({sec:steps[id].sec})===letter(p));
  const arrivals=ps.filter(own), crossings=ps.filter(p=>!own(p));
  const name=p=>{const seg=p.sec.split(' \u00b7 '); return (seg[1]||p.sec).trim();};
  const cls=p=>{const seg=p.sec.split(' \u00b7 '); return seg.slice(2).join(' \u00b7 ').trim();};
  const stopped=ps.filter(p=>reach(p)<p.passage.length).length;

  metrics([
    {l:'ways in',v:arrivals.length,q:'arrival classes, stranger to patron member'},
    {l:'steps',v:all.length,q:'capability sentences, nine sections'},
    {l:'reachable',v:cnt('live'),q:'shown working on a surface today'},
    {l:'proposed',v:cnt('proposed'),q:'waiting on a board adoption'},
    {l:'unbuilt',v:cnt('drafted')+cnt('anticipated'),q:'drafted or not yet taken up'},
    {l:'passages that stop',v:stopped+' of '+ps.length,q:'before their first sitting ends'}
  ]);

  $('#reading').innerHTML=`This is the landscape as a person walks it. Find yourself in the row below: each one is a way into this cooperative, in the order the participation record puts them, from the stranger at the door to the patron member. Choosing one does not filter the record away, it puts your walk in front. Underneath, a <b>passage</b> is the ordered walk you would take in a first sitting, and it ends where it ends. The stop is nowhere written down: it is found by walking each passage until a step is not yet reachable, so it moves on its own as pieces are verified. <b>${stopped} of ${ps.length} passages stop before their first sitting is over.</b><span class="framemark">figures computed from the record; the framing is the instrument\u2019s reading, drafted not adopted</span>`;

  const wrap=document.createElement('div');

  /* where you stand */
  const stands=document.createElement('div'); stands.className='stands';
  const card=(p,isCross)=>{
    const r=reach(p), b=document.createElement('button');
    b.className='stand'+(isCross?' cross':'');
    b.setAttribute('aria-pressed', state.persona===p.sec?'true':'false');
    b.innerHTML=`<span class="sk">${esc(isCross?'across the classes':(cls(p)||'no class yet'))}</span>
      <span class="sn">${esc(name(p))}</span>
      <span class="sr">reaches ${r} of ${p.passage.length} steps</span>`;
    b.onclick=()=>{ state.persona = state.persona===p.sec?null:p.sec; render();
      if(state.persona){ const l=document.querySelector('.lane.focus'); if(l) l.scrollIntoView({block:'nearest'}); } };
    return b;
  };
  arrivals.forEach(p=>stands.appendChild(card(p,false)));
  crossings.forEach(p=>stands.appendChild(card(p,true)));
  wrap.appendChild(stands);
  wrap.insertAdjacentHTML('beforeend','<div class="standnote">The order is the participation record\u2019s order, not a ranking; the classes are not in a race, and a way in is not a rung. The last card, set apart, is a reading that crosses the classes rather than a way in.</div>');

  const lanes=document.createElement('div'); lanes.style.paddingTop='var(--s3)';
  ps.forEach(p=>{
    const r=reach(p), stopId=r<p.passage.length?p.passage[r]:null;
    const lane=document.createElement('div');
    lane.className='lane'+(state.persona===p.sec?' focus':(state.persona?' dim':''));
    const seq=p.passage.map((id,i)=>{
      const cl=i<r?'reached':(i===r?'stop':'beyond');
      return `<span class="st ${cl}" data-id="${id}">${id}</span>`;
    }).join('<span class="arw">&rarr;</span>');
    lane.innerHTML=`<div class="lh"><span>${esc(p.sec)}</span><em>reach ${r} of ${p.passage.length}</em></div>
      <div class="seq">${seq}</div>
      ${stopId?`<div class="lc">stops at <b>${stopId}</b> &middot; ${esc(steps[stopId].note||steps[stopId].state)}</div>`
              :`<div class="lc">the first sitting completes</div>`}`;
    lane.querySelectorAll('.st').forEach(el=>el.onclick=e=>{ e.stopPropagation(); detailStep(steps[el.dataset.id],p); });
    lane.onclick=()=>{ state.persona = state.persona===p.sec?null:p.sec; render(); };
    lanes.appendChild(lane);
  });
  wrap.appendChild(lanes);

  wrap.insertAdjacentHTML('beforeend','<div class="subhead">Every step, by section</div>');
  const rows=document.createElement('div'); rows.className='rows';
  const JTINT={live:'var(--sun-gold-t)',proposed:'var(--sun-violet-t)',drafted:'var(--ember-text)',anticipated:'var(--faint)'};
  Object.values(steps).forEach(s=>{
    const row=document.createElement('div'); row.className='row lrow';
    row.innerHTML=`<span class="id">${esc(s.id)}</span><span class="title">${esc(s.sentence)}</span>
      <span class="cites">${esc((s.sec||'').split(' \u00b7 ')[0])}</span>
      <span class="tag" style="color:${JTINT[s.state]};border-color:${JTINT[s.state]}">${esc(s.state)}</span>`;
    row.onclick=()=>detailStep(s,null);
    rows.appendChild(row);
  });
  wrap.appendChild(rows); c.appendChild(wrap);

  const chosen=ps.find(p=>p.sec===state.persona);
  if(chosen){ detailPersona(chosen,reach(chosen)); return; }
  $('#detail').innerHTML=`<h2>Finding yourself here</h2>
   <p class="note">The row across the top is every way into this cooperative. Pick the one you arrived by, and its walk comes forward while the others stay visible behind it. If none of them is you yet, the first card is: the stranger at the door.</p>
   <h2 style="margin-top:var(--s5)">Reading a passage</h2>
   <p class="note">Each lane is one arrival class walking its first sitting in order. A gold step is reachable today. The dashed step is the <b>stop</b>: the first thing that does not yet work, with what it waits on beside it. Steps past the stop are shown faint because a person never reaches them in that sitting.</p>
   <h2 style="margin-top:var(--s5)">What is computed, and what is not</h2>
   <p class="note">The stop is computed here, by walking. So is the split between a way in and a reading across the classes: a passage that walks none of its own section\u2019s steps is the latter. The condition of each step is <em>not</em> computed: it is still hand-typed on the stories page, because the register that would derive it from the ledger is piece J-01 and does not exist. JOURNEYS v0.1 is drafted and unadopted, so this view shows the shape the module proposes while being honest that half the derivation is still a promise.</p>
   <p class="note">Reach is a count of steps and never a score. The order of the classes is the participation record\u2019s order, never how far each one runs.</p>`;
}
function detailStep(s,p){
  if(!s) return;
  const JT={live:'var(--sun-gold-t)',proposed:'var(--sun-violet-t)',drafted:'var(--ember-text)',anticipated:'var(--faint)'};
  $('#detail').innerHTML=`<h2>Step ${esc(s.id)}</h2><h3 style="font-size:15px">${esc(s.sentence)}</h3>
   <div class="kv"><span>condition</span><b style="color:${JT[s.state]}">${esc(s.state)}</b></div>
   ${s.note?`<div class="kv"><span>waits on</span><b style="font-weight:400">${esc(s.note)}</b></div>`:''}
   ${s.surface?`<div class="kv"><span>surfaces</span><b style="font-weight:400">${esc(s.surface)}</b></div>`:''}
   <div class="kv"><span>section</span><b style="font-weight:400">${esc(s.sec)}</b></div>
   ${s.proven?`<p class="note"><em>Proven when</em> ${esc(s.proven)}</p>`:''}
   <p class="note">A step names no Almanac address yet. Citing the pieces that deliver it is what piece J-01 would add, and it is the join that lets a condition be read rather than typed.</p>`;
}
function detailPersona(p,r){
  $('#detail').innerHTML=`<h2>Passage</h2><h3>${esc(p.sec)}</h3>
   <div class="kv"><span>steps</span><b>${p.passage.length}</b></div>
   <div class="kv"><span>reach</span><b>${r}</b></div>
   <p class="note">${esc(p.narrative)}</p>
   ${p.stopnote?`<p class="note" style="border-left:2px solid var(--warn);padding-left:var(--s3)">${esc(p.stopnote)}</p>`:''}`;
}

/* ============ 03 · TENDING · the rhythm ============
   Reformed against Movement II of the Commonplace. No person is
   counted here: qualification over quantification, collective
   identity over individual accounting, trust rather than
   reputation. The commit is still the medium; what it makes
   legible is the rhythm of the whole and the two piles of
   Meeting 4 - work that tends the place itself, and work that
   grows what lives in it. */
function viewHands(c){
  const St=SNAP.stats, P=St.piles, lifespan=Math.round((new Date(St.last)-new Date(St.first))/864e5);
  const ptot=P.total.tend+P.total.grow;
  metrics([
    {l:'commits',v:St.commits,q:St.first+' to '+St.last},
    {l:'merges',v:St.merges,q:'each an organizer\u2019s reviewed act'},
    {l:'cadence',v:(St.commits/lifespan).toFixed(1)+'/day',q:'across '+lifespan+' days, in sessions'},
    {l:'last 7 days',v:St.last7,q:'a launch-week bloom'},
    {l:'the two piles',v:Math.round(100*P.total.tend/ptot)+' : '+Math.round(100*P.total.grow/ptot),q:'tending the place : growing what lives here'}
  ]);
  $('#reading').innerHTML=`These figures describe the work and are never targets \u2014 Goodhart\u2019s Law entered this cooperative\u2019s record as a design constraint, and this view is built under it. No member is counted or ranked here. Work reaches <b>main</b> by two paths, an organizer\u2019s own hand or a build agent under organizer direction, and both end at a reviewed merge; the log records <b>${St.merges}</b> such acts. Of every ten file-touches, about <b>${Math.round(10*P.total.tend/ptot)}</b> tend the place itself \u2014 the ledger, the validators, the audits \u2014 and <b>${Math.round(10*P.total.grow/ptot)}</b> grow what lives in it.<span class="framemark">figures computed from the record; the framing is the instrument\u2019s reading, drafted not adopted</span>`;

  const wrap=document.createElement('div');
  wrap.insertAdjacentHTML('beforeend',`<div class="subhead">Daily commits \u00b7 the organism\u2019s own rhythm \u00b7 ${St.first} to ${St.last}</div>`);
  const sp=document.createElement('div'); sp.className='spark';
  const days=Object.keys(St.daily).sort(), max=Math.max(...Object.values(St.daily));
  days.forEach(d=>{const i=document.createElement('i');i.style.height=(100*St.daily[d]/max)+'%';i.title=d+' \u00b7 '+St.daily[d]+' commits';sp.appendChild(i);});
  wrap.appendChild(sp);
  wrap.insertAdjacentHTML('beforeend',`<div class="caption"><span>${St.first}</span><span>work arrives in sessions, not streams</span><span>${St.last}</span></div>`);

  wrap.insertAdjacentHTML('beforeend','<div class="subhead">The week\u2019s rhythm \u00b7 file-touches by day, split by pile</div>');
  const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const dmax=Math.max(...DOW.map(d=>{const x=P.dow[d]||{tend:0,grow:0};return x.tend+x.grow;}));
  DOW.forEach(d=>{
    const x=P.dow[d]||{tend:0,grow:0}, t=x.tend+x.grow;
    wrap.insertAdjacentHTML('beforeend',
     `<div class="barline"><span>${d}</span><span class="bar" title="${x.grow} growing \u00b7 ${x.tend} tending">
        <i style="width:${100*t/dmax}%;background:linear-gradient(90deg,var(--sun-rose) 0 ${t?100*x.grow/t:0}%,var(--sun-amber) ${t?100*x.grow/t:0}% 100%)"></i>
      </span><span class="n">${t}</span></div>`);
  });
  wrap.insertAdjacentHTML('beforeend',
   `<div class="caption"><span><span style="color:var(--sun-rose)">\u25a0</span> growing what lives here</span><span><span style="color:var(--sun-amber)">\u25a0</span> tending the place itself</span></div>`);

  wrap.insertAdjacentHTML('beforeend','<div class="subhead">This week\u2019s character \u00b7 the ground the work touched, named not counted</div>');
  wrap.insertAdjacentHTML('beforeend',
   `<div style="padding:6px var(--s5);font:400 13.5px/2 var(--serif);color:var(--text)">`+
   P.week_ground.map(g=>`<span style="border:1px solid var(--line);padding:2px 10px;margin-right:8px;font-family:var(--mono);font-size:11px;color:var(--muted)">${esc(g)}</span>`).join('')+`</div>`);
  c.appendChild(wrap);

  $('#detail').innerHTML=`<h2>The two paths</h2>
   <p class="note">CONTRIBUTORS.md names how work travels: by an organizer\u2019s own hand, or by a build agent working under organizer direction. Both end at a pull request an organizer reviews and merges with the validator green. Only organizers record decisions, adopt drafts, or change a record\u2019s status. The path is a fact of the operating model; it is not a share to be split.</p>
   <h2 style="margin-top:var(--s5)">The two piles</h2>
   <p class="note">Meeting 4\u2019s distinction, applied here by the instrument: one pile is showing up to help the place be itself \u2014 the ledger, the validators, the audits, the workflows \u2014 and the other is the work that grows in it \u2014 the commons, the instruments, the pages. The taxonomy is a reading, not a property of the files: a validator both tends and grows, and the split names the emphasis of a touch, nothing finer.</p>
   <h2 style="margin-top:var(--s5)">What this view leaves out</h2>
   <p class="note">Deliberately: who typed what, how much each hand produced, and any figure that could become a ladder. Qualification over quantification \u2014 the gap this view lives in is the one Movement II names, between wanting gifts seen and refusing to have them priced.</p>`;
}

/* ============ 04 · SUCCESSION · the history ============
   TRANSDUCER-A1 (drafted, not adopted). The medium is the transition:
   one piece changing one mark on one date, recovered by reading every
   revision of the ledger against the one before. The extraction
   discipline of A1 section 3 is the generator's; this view renders
   what it recovered and never smooths it. R7: dwell is elapsed days
   and never an alarm, a target, or a colour that turns overdue. */
const SUCC_ORDER=['anticipated','in-session','in-review','delivered','verified','attested'];
function succMark(st){
  if(st.status==='drafted') return 'drafted';
  return NAMED.has(st.mark) ? st.mark : (st.status.startsWith('open')?'waiting':st.mark);
}
function succColor(m){
  const s=LADDER.concat(OFF).find(x=>x.k===m);
  return s ? s.c : 'var(--sun-coral)';
}
function succTextColor(m){
  const s=LADDER.concat(OFF).find(x=>x.k===m);
  return s ? s.t : 'var(--sun-coral-t)';
}
const dnum=d=>Date.parse(d+'T00:00:00Z')/864e5;
function succBacksteps(P){
  const out=[];
  P.forEach(p=>{
    const seq=p.states.filter(s=>SUCC_ORDER.includes(s.mark));
    for(let i=1;i<seq.length;i++)
      if(SUCC_ORDER.indexOf(seq[i].mark)<SUCC_ORDER.indexOf(seq[i-1].mark))
        out.push({id:p.id,date:seq[i].date,from:seq[i-1].mark,to:seq[i].mark});
  });
  return out;
}
function viewSuccession(c){
  const SU=SNAP.succession, P=SU.pieces, L=SNAP.ledger;
  const cut=SNAP.generated.slice(0,10);
  const t0=dnum(SU.first), t1=Math.max(dnum(cut),dnum(SU.last));
  const span=Math.max(t1-t0,1);
  const trans=P.reduce((n,p)=>n+p.states.length-1,0);
  const back=succBacksteps(P);
  const flat=P.filter(p=>p.states.length===1 && p.states[0].date===SU.first);
  const toVer=[];
  P.forEach(p=>{const v=p.states.find(s=>s.mark==='verified');
    if(v) toVer.push(dnum(v.date)-dnum(p.states[0].date));});
  toVer.sort((a,b)=>a-b);
  const med=toVer.length?toVer[Math.floor(toVer.length/2)]:0;
  metrics([
    {l:'ledger revisions read',v:SU.revisions,q:SU.first+' to '+SU.last+' \u00b7 the grain of this view'},
    {l:'transitions recovered',v:trans,q:'no day collapsed, no path smoothed'},
    {l:'corrections',v:back.length,q:'colour stepping back, kept visible'},
    {l:'median days to verified',v:med,q:'across '+toVer.length+' pieces \u00b7 a floor, not a measurement'},
    {l:'holding their first mark',v:flat.length,q:'since the ledger\u2019s first day'}
  ]);
  $('#reading').innerHTML=`The estate\u2019s dwell reads in two layers. Above: ripening is quick where it happens at all, a median of <b>${med} days</b> from first appearance to verified. Below: <b>${flat.length} pieces have held their first mark since the ledger\u2019s first day</b>, an unbroken band beneath the churn, composed almost entirely of drafted governing documents and anticipated proofs. What moves quickly is what an instrument can do; what has not moved at all is what waits on a person adopting, attesting, or deciding. The flat layer is not a backlog \u2013 it is the boundary between capability and authority, drawn in time.<span class="framemark">figures computed from the record; the framing is the instrument\u2019s reading, drafted not adopted</span>`;

  const bedOf={}; L.forEach(i=>bedOf[i.id]=i.bed);
  const groups={};
  P.forEach(p=>{const b=bedOf[p.id]||'no longer in the ledger';(groups[b]=groups[b]||[]).push(p);});
  const wrap=document.createElement('div');
  Object.keys(groups).forEach(bed=>{
    wrap.insertAdjacentHTML('beforeend',`<div class="subhead">${esc(bed)}</div>`);
    groups[bed].forEach(p=>{
      const row=document.createElement('div'); row.className='succ-row';
      const id=document.createElement('span'); id.className='id'; id.textContent=p.id;
      const strip=document.createElement('span'); strip.className='succ-strip';
      const lead=dnum(p.states[0].date)-t0;
      if(lead>0){const g=document.createElement('i');g.style.flexGrow=lead;g.style.minWidth='0';g.style.background='transparent';strip.appendChild(g);}
      p.states.forEach((s,i)=>{
        const end=i+1<p.states.length?dnum(p.states[i+1].date):t1;
        const seg=document.createElement('i');
        seg.style.flexGrow=Math.max(end-dnum(s.date),0);
        seg.style.background=succColor(succMark(s));
        seg.title=p.id+' \u00b7 '+s.status+' from '+s.date;
        strip.appendChild(seg);
      });
      row.appendChild(id); row.appendChild(strip);
      row.onclick=()=>{document.querySelectorAll('.succ-row').forEach(r=>r.classList.remove('sel'));
        row.classList.add('sel'); detailSuccession(p,cut);};
      wrap.appendChild(row);
    });
  });
  wrap.insertAdjacentHTML('beforeend',`<div class="succ-axis"><span>${SU.first}</span><span>the ledger\u2019s own commit rhythm \u00b7 nothing finer</span><span>${cut}</span></div>`);
  c.appendChild(wrap);

  $('#detail').innerHTML=`<h2>The corrections</h2>
   <p class="note">Colour stepping back is the conservation law working, not an embarrassment tidied away: a wrong entry answered rather than erased.</p>
   ${back.map(b=>`<div class="kv"><span>${esc(b.id)} \u00b7 ${b.date}</span><b style="font-weight:400">${esc(b.from)} \u2192 ${esc(b.to)}</b></div>`).join('')||'<p class="note">none recovered at this cut</p>'}
   <h2 style="margin-top:var(--s5)">The grain</h2>
   <p class="note">This view read <b>${SU.revisions} revisions</b> of the ledger and can be no finer than they are. A mark that flipped twice between two ledger commits is invisible even here; a dwell figure is a floor, not a measurement. The durable remedy is the ledger emitting transitions as events, which is TRANSDUCER-D8 and not this view\u2019s call.</p>
   <h2 style="margin-top:var(--s5)">No dwell as deadline</h2>
   <p class="note">R7: time in a mark is elapsed days, never an ageing alarm or a colour that turns overdue. There is no threshold at which a piece becomes late, because there is no promise it was late against. The flat layer is the record of a cooperative refusing to rush its own governance.</p>`;
}
function detailSuccession(p,cut){
  const rows=p.states.map((s,i)=>{
    const end=i+1<p.states.length?p.states[i+1].date:cut;
    const days=Math.max(Math.round(dnum(end)-dnum(s.date)),0);
    const last=i+1===p.states.length;
    return `<div class="kv"><span>${s.date} \u00b7 <b style="color:${succTextColor(succMark(s))};font-weight:500">${esc(s.mark)}</b></span><b style="font-weight:400">${last?'at least ':''}${days} day${days===1?'':'s'}</b></div>`;
  }).join('');
  $('#detail').innerHTML=`<h2>Piece ${esc(p.id)}</h2>
   <p class="note">Every distinct state this piece was observed to hold, in the order observed, including several on one date. Days are counted at the ledger\u2019s own grain and are floors.</p>${rows}
   ${p.states.length>1?'':'<p class="note">One state, held since it entered: dwell without succession.</p>'}`;
}


/* ============================================================
   THE FIFTH PRINCIPLE
   The International Co-operative Alliance's fifth principle is
   Education, Training and Information: co-operatives educate and
   train their members so they can contribute effectively, and
   they inform the general public about the nature and benefits
   of co-operation. Those are two different jobs and this surface
   does them in three parts: a walk for the guest (information),
   a gloss on every specialist word (education), and a set of
   things to try (training). Definitions are the estate's own,
   drawn from the Lexicon at techne.coop/commons/build/lexicon/,
   not invented here.
   ============================================================ */
const GLOSS={
 'transition':['One piece changing one mark on one date. The estate does not store it; it is recovered by reading every revision of the ledger against the one before, which the append-only record makes possible without anyone having planned for it.','TRANSDUCER-A1 \u00a72'],
 'dwell':['How long a piece has held its present mark, counted in days and shown as a floor, never a deadline. There is no threshold at which a piece becomes late, because there is no promise it was late against.','TRANSDUCER-A1 \u00a74 \u00b7 R7'],
 'append-only':['The history admits new entries and refuses every change to old ones. Nothing is edited or deleted; a mistake is answered by a new entry pointing back at it.','Lexicon §3'],
 'commit':['One saved change to the files, with its author, date, and message. A repository\u2019s history is a chain of them.','general'],
 'merge':['The act of folding a proposed change into the main history. Here it is also adoption: a person doing it is the moment a draft becomes real.','Lexicon §6'],
 'pull request':['A proposed change, offered for review before it joins the main history.','general'],
 'repository':['The folder of files together with the whole history of how they got that way.','general'],
 'ledger':['The list of every piece of work this cooperative has named, each with an address, an intent, and a mark saying how far it came.','Almanac'],
 'address':['A short code naming one piece of work, like G0 or L-06. The branch, the proposed change, and the record all carry the same one, so any piece can be traced end to end.','Lexicon §6'],
 'piece':['One unit of build work: small enough to finish, named by an address, belonging to a bed.','Lexicon §6'],
 'bed':['An ordered run of pieces that share a single proof. Work grows in beds the way plants do.','Lexicon §6'],
 'mark':['The word saying how far a piece has come: drafted, anticipated, delivered, verified, attested.','Lexicon §6'],
 'drafted':['Written but not adopted. It binds nothing until a person takes it up.','Lexicon §6'],
 'anticipated':['Named and waiting. Nobody has taken it up yet.','Lexicon §6'],
 'delivered':['Merged into the main history, but nobody has yet walked through it to check it does what it claims.','Lexicon §6'],
 'verified':['A person walked its acceptance and found it true. Not a test suite passing.','Lexicon §6'],
 'attested':['Demonstrated end to end and witnessed by two people, recorded as an event.','Lexicon §6'],
 'proof':['A capability shown working from beginning to end in front of witnesses, and recorded. Ten are named here; one has been given.','Lexicon §6'],
 'adoption':['The visible human act that turns a draft into a record. The system runs on adoption the way the database runs on events.','Lexicon §6'],
 'event':['The unit of record: one thing that happened, written once, never edited.','Lexicon §3'],
 'tally':['A figure worked out from the history each time it is asked for, never stored. Any number can be traced back to what produced it.','Lexicon §3'],
 'transducer':['The instrument standing where the record crosses into human perception: it converts state into something a person can hold without severing the path back. This screen is that instrument. The naming supersedes the register’s earlier use of the word for the tally, per TRANSDUCER v0.1, which is drafted and not yet adopted.','TRANSDUCER v0.1 §2'],
 'organizer':['A person who decides, signs, and governs. Instruments draft and surface; organizers adopt. Responsibility never transfers to an instrument.','Lexicon §4'],
 'walkaway':['The proof that the cooperative could leave: export everything, rebuild it elsewhere from the public record alone, and get the identical result.','Lexicon §7'],
 'Almanac':['The page where this cooperative publishes what it is building and how far each piece has come.','techne.coop/commons/build/'],
 'Lexicon':['The estate\u2019s own dictionary, where each working word is defined in plain language.','techne.coop/commons/build/lexicon/'],
 'cooperative':['A business owned and governed by its members rather than by outside shareholders, one member one vote.','ICA Statement of Identity'],
 'treemap':['A picture where every rectangle is one thing and its area is that thing\u2019s size, so the big ones are obvious at a glance.','general'],
 'cross-section':['A cut straight across, the way a tree stump shows its rings, so layers that formed at different speeds can be seen together.','general'],
 'Goodhart':['Goodhart\u2019s Law: once a measure becomes a target, it stops being a good measure. People optimise the number instead of the thing.','Commonplace, Movement II']
};
const GTERMS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
let glossing=false;
function glossify(root){
  if(!root) return;
  const seen=new Set();
  const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
    const p=n.parentElement;
    if(!p||p.closest('.gl,.glpop,h2,.l,.k,.tag,.id,.n')) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;}});
  const nodes=[]; while(walk.nextNode()) nodes.push(walk.currentNode);
  nodes.forEach(n=>{
    let txt=n.nodeValue, hit=null, idx=-1, term=null;
    for(const t of GTERMS){
      if(seen.has(t)) continue;
      const re=new RegExp('\\b'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
      const m=txt.match(re);
      if(m && (idx<0 || m.index<idx)){ idx=m.index; hit=m[0]; term=t; }
    }
    if(!hit) return;
    seen.add(term);
    const after=n.splitText(idx), rest=after.splitText(hit.length);
    const span=document.createElement('span');
    span.className='gl'; span.dataset.t=term; span.textContent=hit;
    after.parentNode.replaceChild(span,after);
  });
}
function reglossAll(){
  if(glossing) return; glossing=true;
  requestAnimationFrame(()=>{ glossify($('#reading')); glossify($('#detail')); glossing=false; });
}
const pop=()=>$('#glpop');
document.addEventListener('click',e=>{
  const g=e.target.closest && e.target.closest('.gl');
  if(!g){ pop().style.display='none'; return; }
  const [d,s]=GLOSS[g.dataset.t];
  pop().innerHTML=`<div class="t">${esc(g.dataset.t)}</div><div class="d">${esc(d)}</div><div class="s">${esc(s)}</div>`;
  const r=g.getBoundingClientRect();
  pop().style.display='block';
  const pr=pop().getBoundingClientRect();
  pop().style.left=Math.min(Math.max(8,r.left),innerWidth-pr.width-8)+'px';
  pop().style.top=(r.bottom+8+pr.height>innerHeight? r.top-pr.height-8 : r.bottom+8)+'px';
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') pop().style.display='none'; });

/* ---- the plain line: one sentence per view, no estate words ---- */
const PLAIN={
 standing:'<b>What you are looking at:</b> one cooperative\u2019s work cut across like a tree stump, so the layers that change slowly and the layers that change fast can be seen at once.',
 code:'<b>What you are looking at:</b> every file in the project as a rectangle, sized by how big it is and shaded by how often it has been changed.',

/* ---- the walk ----------------------------------------------
   Two rules, both learned the hard way. First: the card is never
   placed over the thing it describes. The screen minus the target
   rectangle leaves four free bands; the card goes in the largest
   band that can hold it, and is sized to that band. If nothing
   fits, the card shrinks and scrolls rather than covering.
   Second: a target larger than about a third of the screen gets
   corner brackets and no dimming at all, because dimming a whole
   region to introduce it destroys the very structure being shown.
   ------------------------------------------------------------ */
const WALK=[
 {v:'journeys',t:null,h:'Volunteered attention',
  b:['A cooperative runs on attention people give freely, and it coordinates through meetings, minutes, and memory. The formation record names the trouble plainly: the place ran collectively, but the picture of it lived in whoever was in the room.',
     'An information system helps in one way. It keeps the record where anyone can read it without asking anyone, so volunteered attention goes to deciding rather than reconstructing.'],
  c:'Two practical drivers &middot; Meeting 1'},

 {v:'journeys',t:null,h:'A tool alongside, not in place of',
  b:['Cybernetics is an old word for the study of steering: how a thing senses its own state and adjusts. A cooperative reading its own record and correcting course is that loop, with people in it.',

  c:'Augmentation over automation &middot; Meeting 15'},

 {v:'journeys',t:'.stands',lens:'00 · where you stand',h:'Journeys',
  b:['Start with yourself. Each card is a way into this cooperative, in the participation record&rsquo;s own order, from the stranger at the door to the patron member. Pick the one you arrived by and your walk comes forward; the others stay visible behind it.',
     'The lanes below are those walks in order. The dashed step is where the walk stops today, and what it waits on. Nobody typed the stops in; they are found against the record, and move on their own as pieces finish.'],
  c:'Concentric circles of belonging &middot; Meeting 4. Lanes are kinds of arrival, never people.'},

 {v:'standing',t:'.disc',lens:'01 · the whole',h:'Standing',
  b:['Now the same place from above: the cooperative cut across the grain, read the way a stump is read. History at the heart, then the governing documents, then the beds of work, then the proofs, then the public site at the rim.',
     'One look answers what is solid, what is waiting, and where the organisation is still becoming itself.'],
  c:'One dated moment. A cross-section cannot show time.'},

 {v:'ledger',t:'#ladder',lens:'02 · the work',h:'Maturation',
  b:['Every named piece of work, marked by how far it came: not yet taken up, delivered, verified.',
     'The marks qualify; they do not rank. Delivered means the machinery is satisfied. Verified means a person walked it and found it true. A cooperative answers to people, so a person is the bar.'],
  c:'Qualification over quantification &middot; Meeting 1'},

 {v:'hands',t:'#overview',lens:'03 · the rhythm',h:'Tending',
  b:['When the work happened, and which of two piles it fell into: helping the place be itself, or growing what lives within it. Both belong.',
     'What is missing is deliberate. No counts per person, no ranking, because when a measure becomes a target it ceases to be a good measure. The rhythm of the whole is shown, and no one is scored.'],
  c:'The two piles &middot; Meeting 4. Goodhart&rsquo;s Law &middot; Meeting 3.'},

 {v:'code',t:'.canvas',lens:'05 · the material',h:'Composition',
  b:['Last, and last on purpose: everything written, as rectangles. Bigger is larger, darker is revised more often. This is the layer a builder reads, and you can leave without it.',
     'The formation record settled early that this place is soil rather than firm. So mass that sits quiet is substrate, not neglect; the small dark blocks are where attention keeps returning.'],
  c:'Soil, not firm &middot; Meeting 3. Size is not merit.'}
];
let step=0, walking=false;

function targetEl(t){
  if(!t) return null;
  if(t==='gl') return document.querySelector('#reading .gl')||document.querySelector('#detail .gl');
  if(t.startsWith('ring:')) return (typeof RING_NODES!=='undefined')?RING_NODES[t.slice(5)]:null;
  return document.querySelector(t);
}
function clearMarks(){
  $('#veil').classList.remove('on');
  ['bT','bB','bL','bR'].forEach(i=>$('#'+i).classList.remove('on','soft'));
  const rl=$('#rlight'); rl.classList.remove('on','bracket'); rl.innerHTML='';
}
function markTarget(el){
  clearMarks();
  if(!el){ $('#veil').classList.add('on'); return null; }
  const r=el.getBoundingClientRect();
  if(!r.width||!r.height) return null;
  const pad=7, W=innerWidth, H=innerHeight;
  const box={l:Math.max(0,r.left-pad),t:Math.max(0,r.top-pad)};
  box.w=Math.min(W,r.right+pad)-box.l; box.h=Math.min(H,r.bottom+pad)-box.t;
  const big=(box.w*box.h)/(W*H) > 0.33;
  const rl=$('#rlight');
  Object.assign(rl.style,{left:box.l+'px',top:box.t+'px',width:box.w+'px',height:box.h+'px'});
  rl.classList.add('on');
  if(big){ rl.classList.add('bracket'); rl.innerHTML='<i></i><i></i><i></i><i></i>'; }
  const set=(id,st)=>{const e=$('#'+id);Object.assign(e.style,st);e.classList.add('on');if(big)e.classList.add('soft');};
  set('bT',{left:'0px',top:'0px',width:W+'px',height:box.t+'px'});
  set('bB',{left:'0px',top:(box.t+box.h)+'px',width:W+'px',height:Math.max(0,H-box.t-box.h)+'px'});
  set('bL',{left:'0px',top:box.t+'px',width:box.l+'px',height:box.h+'px'});
  set('bR',{left:(box.l+box.w)+'px',top:box.t+'px',width:Math.max(0,W-box.l-box.w)+'px',height:box.h+'px'});
  return box;
}
/* The card docks into the detail panel’s place for the whole walk:
   the one UI card the walk never needs to point at gives up its slot,
   so the card and the interface never compete for the same ground.
   If the aside is not on screen (narrow layouts), fall back to the
   largest free band beside the highlighted element. */
function freeBands(box,W,H){
  if(!box) return [{x:0,y:0,w:W,h:H}];
  return [
    {x:0,y:0,w:W,h:box.t},
    {x:0,y:box.t+box.h,w:W,h:H-(box.t+box.h)},
    {x:0,y:0,w:box.l,h:H},
    {x:box.l+box.w,y:0,w:W-(box.l+box.w),h:H}
  ].filter(b=>b.w>0&&b.h>0);
}
let coachFloat=false, coachPos=null;
function placeCoach(box){
  const c=$('#coach'), W=innerWidth, H=innerHeight, gap=10;
  c.classList.add('on'); c.style.maxHeight='none';
  if(coachFloat){
    c.classList.add('float');
    if(coachPos){
      c.style.left=Math.min(Math.max(0,coachPos.x),W-120)+'px';
      c.style.top=Math.min(Math.max(0,coachPos.y),H-80)+'px';
      if(coachPos.w) c.style.width=coachPos.w+'px';
      if(coachPos.h){ c.style.height=coachPos.h+'px'; }
    }
    return;
  }
  c.classList.remove('float');
  const aside=document.querySelector('aside');
  const ar=aside?aside.getBoundingClientRect():null;
  if(ar && ar.width>220 && ar.height>240){
    c.style.left=Math.round(ar.left)+'px';
    c.style.top=Math.round(ar.top)+'px';
    c.style.width=Math.round(ar.width)+'px';
    c.style.maxHeight=Math.round(ar.height)+'px';
    c.style.height=Math.round(ar.height)+'px';
    return;
  }
  c.style.height='auto';
  const MINW=300, MAXW=560;
  const cand=freeBands(box,W,H)
    .map(b=>({b,w:Math.max(MINW,Math.min(MAXW,b.w-gap*2))}))
    .filter(o=>o.b.w>=MINW+gap*2)
    .sort((a,b)=>(b.b.w*b.b.h)-(a.b.w*a.b.h));
  let chosen=cand.find(o=>{c.style.width=o.w+'px';return c.offsetHeight<=o.b.h-gap*2;});
  if(!chosen){
    chosen=cand[0]||{b:{x:0,y:0,w:W,h:H},w:Math.min(MAXW,W-gap*2)};
    c.style.width=chosen.w+'px';
    c.style.maxHeight=Math.max(140,chosen.b.h-gap*2)+'px';
  }
  const b=chosen.b, ch=Math.min(c.offsetHeight,b.h-gap*2);
  c.style.left=Math.round(b.x+(b.w-chosen.w)/2)+'px';
  c.style.top=Math.round(b.y+Math.max(gap,(b.h-ch)/2))+'px';
}
function showGuide(i){
  step=Math.max(0,Math.min(WALK.length-1,i)); walking=true;
  const w=WALK[step];
  if(w.v!==state.view){
    document.querySelectorAll('.lens').forEach(x=>x.setAttribute('aria-pressed',x.dataset.view===w.v?'true':'false'));
    state.view=w.v; state.filter=null; state.ring=null; render();
  }
  if(state.view==='standing'&&typeof pick==='function'){
    try{ pick(w.t&&w.t.startsWith('ring:')?w.t.slice(5):null); }catch(e){}
  }
  $('#coach').innerHTML=`<div class="dragbar" id="dragbar"><span class="grip"></span>
      <span class="step">the walk &middot; ${step+1} of ${WALK.length}</span>
      <button class="dock" id="dockbtn">${coachFloat?'dock':'undock'}</button></div>
    <div class="inner" id="coachinner">
    ${w.lens?'<div class="lensname">'+w.lens+'</div>':''}
    <h3>${esc(w.h)}</h3>${w.b.map(x=>'<p>'+x+'</p>').join('')}
    ${w.c?'<div class="cite">'+w.c+'</div>':''}
    <div class="nav">
      <button class="btn" id="gprev"${step?'':' disabled style="opacity:.35"'}>back</button>
      <button class="btn solid" id="gnext">${step===WALK.length-1?'begin':'next'}</button>
      <button class="btn" id="gclose">close</button>
      <span class="dots">${WALK.map((_,j)=>'<i class="'+(j===step?'on':'')+'" data-j="'+j+'"></i>').join('')}</span>
    </div></div>
    <div class="keys"><span><b>A</b>/<b>D</b> back / next</span><span><b>W</b>/<b>S</b> scroll</span><span><b>1</b>&ndash;<b>${WALK.length}</b> jump</span><span><b>F</b> float / dock</span><span><b>esc</b> close</span></div>`;
  $('#coach').classList.add('on');
  glossify($('#coach'));
  $('#gprev').onclick=()=>showGuide(step-1);
  $('#gnext').onclick=()=>step===WALK.length-1?closeGuide():showGuide(step+1);
  $('#gclose').onclick=closeGuide;
  $('#coach').querySelectorAll('.dots i').forEach(d=>d.onclick=()=>showGuide(+d.dataset.j));
  $('#dockbtn').onclick=e=>{e.stopPropagation();coachFloat=!coachFloat;
    if(!coachFloat){coachPos=null;$('#coach').style.height='';}
    placeCoach(markTarget(targetEl(WALK[step].t)));};
  (function(){
    const bar=$('#dragbar'), c=$('#coach');
    let sx,sy,ox,oy,drag=false;
    bar.addEventListener('pointerdown',ev=>{
      if(ev.target.id==='dockbtn') return;
      drag=true; bar.setPointerCapture(ev.pointerId);
      const r=c.getBoundingClientRect(); sx=ev.clientX; sy=ev.clientY; ox=r.left; oy=r.top;
      if(!coachFloat){ coachFloat=true; c.classList.add('float');
        c.style.width=r.width+'px'; c.style.height=r.height+'px'; }
    });
    bar.addEventListener('pointermove',ev=>{
      if(!drag) return;
      const x=ox+ev.clientX-sx, y=oy+ev.clientY-sy;
      c.style.left=Math.max(0,Math.min(innerWidth-120,x))+'px';
      c.style.top=Math.max(0,Math.min(innerHeight-60,y))+'px';
    });
    bar.addEventListener('pointerup',ev=>{
      if(!drag) return; drag=false;
      const r=c.getBoundingClientRect();
      coachPos={x:r.left,y:r.top,w:r.width,h:r.height};
      const db=$('#dockbtn'); if(db) db.textContent='dock';
    });
  })();
  requestAnimationFrame(()=>requestAnimationFrame(()=>placeCoach(markTarget(targetEl(w.t)))));
}
function closeGuide(){
  walking=false; clearMarks(); $('#coach').classList.remove('on');
  const co=$('#coach'); co.style.height=''; co.style.width=''; co.classList.remove('float');
  try{render();}catch(e){}
  try{localStorage.setItem('hud-walked','1');}catch(e){}
}
$('#guidebtn').onclick=()=>showGuide(0);
['bT','bB','bL','bR','veil'].forEach(i=>$('#'+i).addEventListener('click',closeGuide));
document.addEventListener('keydown',e=>{
  if(!walking) return;
  if(document.activeElement&&/input|textarea/i.test(document.activeElement.tagName)) return;
  const k=e.key.toLowerCase();
  if(e.key==='Escape'){ closeGuide(); e.stopPropagation(); return; }
  if(e.key==='ArrowRight'||k==='d'){ e.preventDefault(); showGuide(step+1); return; }
  if(e.key==='ArrowLeft'||k==='a'){ e.preventDefault(); showGuide(step-1); return; }
  if(k==='w'||k==='s'||e.key==='ArrowUp'||e.key==='ArrowDown'){
    e.preventDefault();
    const inner=$('#coachinner'); if(inner) inner.scrollBy({top:(k==='w'||e.key==='ArrowUp')?-120:120,behavior:'smooth'});
    return;
  }
  if(k==='f'){ e.preventDefault(); const db=$('#dockbtn'); if(db) db.click(); return; }
  if(/^[1-9]$/.test(e.key)){ const j=+e.key-1; if(j<WALK.length){ e.preventDefault(); showGuide(j);} return; }
});
addEventListener('resize',()=>{ if(walking) requestAnimationFrame(()=>placeCoach(markTarget(targetEl(WALK[step].t)))); });
new MutationObserver(reglossAll).observe($('#detail'),{childList:true,subtree:false});
new MutationObserver(reglossAll).observe($('#reading'),{childList:true,subtree:false});

window.addEventListener('resize',()=>{if(state.view==='code'||state.view==='standing')render();});
render();
try{ if(!localStorage.getItem('hud-walked')) showGuide(0); }catch(e){}
reglossAll();
</script>
