<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Transducer &middot; Intranet &middot; Techne</title>
<meta name="description" content="The transducer: the estate's own record rendered at human variety. Six lenses over one dated cut of the repository, ledger, and participation stories, ordered by legibility to the member body and opening on the journeys landscape. Drafted instrument of TRANSDUCER v0.2, not adopted. RegenHub, LCA.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" type="image/png" href="/favicon.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Tokens ported from techne.coop/design-system (v4 palette, X-06 type decision) */
  :root{
    --serif:"Libre Baskerville",Georgia,serif;
    --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
    --dur:.4s;--micro:.16s;--ease:cubic-bezier(.4,0,.2,1);
    --sun-gold:#EAB668;--sun-amber:#E09A52;--sun-coral:#D1755A;--sun-rose:#B45C7C;--sun-violet:#6E5494;--sun-blue:#5476B8;
  }
  html[data-mode="dark"]{
    --bg:#0F0F12;--inset:#08080A;--surface:#16161B;--raised:#232329;
    --line:#2A2A30;--rule:#3A3A42;
    --heading:#E8E4DF;--text:#CFCBC4;--muted:#8A857E;--faint:#5A554F;
    --blue:#6A8AC4;--blue-text:#97B5E8;--ember:#C4956A;--ember-text:#D4A57A;
    --ok:#6A9A6A;--info:#6A8AC4;--warn:#C46A6A;
    --sun-gold-t:#EAB668;--sun-amber-t:#E5A562;--sun-coral-t:#DE8872;
    --sun-rose-t:#CF7C9A;--sun-violet-t:#9E86C4;--sun-blue-t:#8FAEE0;
  }
  html[data-mode="light"]{
    --bg:#F7F5F0;--inset:#EBE7DF;--surface:#FCFBF8;--raised:#FEFDFB;
    --line:#D8D3C8;--rule:#9A958A;
    --heading:#1A1A1F;--text:#2E2C28;--muted:#646058;--faint:#A39E92;
    --blue:#4A6FB0;--blue-text:#39588F;--ember:#8A6A4A;--ember-text:#6F5436;
    --ok:#4A7A4A;--info:#4A6FB0;--warn:#A84F4C;
    --sun-gold-t:#87621F;--sun-amber-t:#8C581D;--sun-coral-t:#9C4636;
    --sun-rose-t:#8C3D58;--sun-violet-t:#4C3870;--sun-blue-t:#3A5694;
  }
  *{box-sizing:border-box;margin:0}
  html{color-scheme:dark light;height:100%}
  body{height:100%;background:var(--bg);color:var(--text);font:400 15px/1.7 var(--serif);
    display:flex;flex-direction:column;overflow:hidden;
    transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease);}
  .mono{font-family:var(--mono)} .num{font-variant-numeric:tabular-nums}
  a{color:var(--blue-text);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
  a:hover{text-decoration-thickness:2px}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  /* topbar, after the CIS shell */
  .hudbar{display:flex;align-items:center;gap:var(--s4);padding:9px var(--s5);
    border-bottom:1px solid var(--line);background:var(--surface);flex:0 0 auto;flex-wrap:wrap}
  .hudbar .mark{font:500 .78rem/1 var(--mono);color:var(--ember-text);letter-spacing:.06em;text-transform:uppercase}
  .chip{display:inline-flex;align-items:center;gap:6px;font:500 10.5px/1 var(--mono);padding:5px 9px;
    border:1px solid var(--line);border-radius:2px;background:var(--surface);letter-spacing:.02em;color:var(--muted)}
  .chip b{color:var(--heading);font-weight:500}
  .chip .dot{width:6px;height:6px;background:var(--ember)}
  .btn{font:500 12px/1 var(--mono);color:var(--muted);background:transparent;border:1px solid var(--line);
    border-radius:2px;padding:0 12px;height:28px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    transition:color var(--micro) var(--ease),border-color var(--micro) var(--ease)}
  .btn:hover{color:var(--ember-text);border-color:var(--ember)}
  .spacer{margin-left:auto}

  /* the sunset band: the whole system's rhythm, drawn once */
  .band{display:flex;gap:0;height:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:0 0 auto}
  .band span{flex:1;transition:opacity var(--micro) var(--ease)}

  /* lens rail */
  .lenses{display:flex;gap:0;flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--bg)}
  .lens{flex:1;text-align:left;background:transparent;border:0;border-right:1px solid var(--line);
    padding:10px var(--s4);cursor:pointer;color:var(--muted);display:flex;flex-direction:column;gap:3px}
  .lens:last-child{border-right:0}
  .lens .k{font:500 10px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .lens .t{font:400 15px/1.2 var(--serif);color:var(--heading)}
  .lens .d{font:400 11.5px/1.5 var(--mono);color:var(--muted)}
  .lens[aria-pressed="true"]{background:var(--surface);color:var(--text)}
  .lens[aria-pressed="true"] .k{color:var(--cis-tint,var(--ember))}
  .lens[aria-pressed="true"]{box-shadow:inset 0 2px 0 var(--cis-tint,var(--ember))}

  main{flex:1;min-height:0;display:flex;gap:0}
  .stage{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--line)}
  /* overview strip: the ecosystemic reading */
  .overview{display:flex;gap:0;border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--surface);flex-wrap:wrap}
  .metric{flex:1;min-width:118px;padding:9px var(--s4);border-right:1px solid var(--line)}
  .metric:last-child{border-right:0}
  .metric .l{font:500 9.5px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .metric .v{font:400 21px/1.25 var(--serif);color:var(--heading);font-variant-numeric:tabular-nums}
  .metric .q{font:400 10.5px/1.45 var(--mono);color:var(--muted);margin-top:2px}
  .reading{padding:9px var(--s5);border-bottom:1px solid var(--line);flex:0 0 auto;
    font:400 13px/1.65 var(--serif);color:var(--text);background:var(--bg)}
  .reading b{color:var(--heading);font-weight:700}
  .canvas{flex:1;min-height:0;overflow:auto;position:relative;background:var(--bg)}

  aside{width:318px;flex:0 0 auto;overflow:auto;padding:var(--s4) var(--s5);background:var(--surface)}
  aside h2{font:600 10.5px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:var(--s3)}
  aside h3{font:400 17px/1.25 var(--serif);color:var(--heading);margin-bottom:var(--s2)}
  .kv{display:flex;justify-content:space-between;gap:var(--s3);padding:6px 0;border-bottom:1px solid var(--line);
    font:400 12px/1.5 var(--mono)}
  .kv span{color:var(--muted)} .kv b{color:var(--heading);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
  .note{font:400 12.5px/1.7 var(--serif);color:var(--muted);margin-top:var(--s3)}
  .note b{color:var(--heading);font-weight:700}


  /* the cross-section */
  .disc{position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,
    color-mix(in srgb, var(--sun-gold) 5%, var(--surface)) 0%, var(--bg) 56%, var(--inset) 100%);}
  .disc svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .rnode{cursor:pointer;transition:opacity var(--dur) var(--ease)}
  .rnode.faded{opacity:.15}
  .rnode.faded:hover{opacity:.6}
  .rnode:focus{outline:none}
  .rnode .halo{fill:none;stroke:var(--ember);stroke-dasharray:3 3;stroke-width:1.4;opacity:0}
  .rnode.sel .halo,.rnode:hover .halo{opacity:1}
  .rnode:hover .halo{stroke:var(--rule)}
  /* the halo carries the label over whatever fill sits under it; 2.5px smears
     glyphs at the 7-8px sizes the inner rings use, so keep it just under 2 */
  .rnode text{font-family:var(--mono);fill:var(--heading);pointer-events:none;
    paint-order:stroke;stroke:var(--bg);stroke-width:1.8px;stroke-linejoin:round}
  .rnode.sel text,.rnode:hover text{fill:var(--heading)}
  .ringrule{fill:none;stroke:var(--line);stroke-width:1;opacity:.55}
  .ringrule.dashed{stroke-dasharray:4 5}
  .ringname{font-family:var(--mono);fill:var(--muted);letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
  .heartc{fill:color-mix(in srgb, var(--ok) 24%, var(--inset));stroke:var(--ok);stroke-width:1}
  .barkword{font-family:var(--serif);font-style:italic;fill:var(--heading);pointer-events:none}
  .edge{fill:none;stroke:var(--bg);stroke-width:1.2}
  .capA{fill:var(--sun-gold)}
  .capN{fill:none;stroke:var(--faint);stroke-width:1.2;stroke-dasharray:2.5 2.5}
  .dischint{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font:400 10px/1.5 var(--mono);
    color:var(--faint);pointer-events:none;white-space:nowrap}

  /* the fifth principle: information, education, training */
  .gl{font-weight:400;border-bottom:1px dotted var(--rule);cursor:help;color:inherit}
  .gl:hover{border-bottom-color:var(--ember);color:var(--heading)}
  .glpop{position:fixed;z-index:80;max-width:460px;background:var(--raised);border:1px solid var(--rule);
    padding:var(--s3) var(--s4);box-shadow:0 8px 30px rgba(0,0,0,.35);display:none}
  .glpop .t{font:500 13px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ember-text);margin-bottom:5px}
  .glpop .d{font:400 17px/1.65 var(--serif);color:var(--text)}
  .glpop .s{font:400 12px/1.5 var(--mono);color:var(--faint);margin-top:7px}
  /* the walk: the card is placed in free space, never over the target.
     Large regions get corner brackets and no dimming, so structure stays whole. */
  .wband{position:fixed;background:var(--bg);opacity:.72;z-index:100;display:none}
  .veil{position:fixed;inset:0;background:var(--bg);opacity:.72;z-index:100;display:none}
  .veil.on{display:block}
  .wband.on{display:block}
  .ringlight{position:fixed;z-index:110;pointer-events:none;display:none;
    border:1px solid var(--ember);box-shadow:0 0 0 1px var(--bg),0 0 20px color-mix(in srgb,var(--ember) 50%,transparent);
    transition:all var(--dur) var(--ease)}
  .ringlight.on{display:block}
  .ringlight.bracket{border:0;box-shadow:none}
  .wband.soft{opacity:.34}
  .ringlight.bracket i{position:absolute;width:20px;height:20px;border:2px solid var(--ember)}
  .ringlight.bracket i:nth-child(1){left:-1px;top:-1px;border-right:0;border-bottom:0}
  .ringlight.bracket i:nth-child(2){right:-1px;top:-1px;border-left:0;border-bottom:0}
  .ringlight.bracket i:nth-child(3){left:-1px;bottom:-1px;border-right:0;border-top:0}
  .ringlight.bracket i:nth-child(4){right:-1px;bottom:-1px;border-left:0;border-top:0}
  .coach{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--rule);
    box-shadow:0 10px 34px rgba(0,0,0,.42);padding:0;display:none;overflow:hidden;flex-direction:column}
  .coach.on{display:flex}
  .coach.float{resize:both;min-width:300px;min-height:220px}
  .dragbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;cursor:grab;
    padding:8px var(--s4);border-bottom:1px solid var(--line);background:var(--raised);
    user-select:none}
  .dragbar:active{cursor:grabbing}
  .dragbar .grip{width:22px;height:10px;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule);opacity:.7}
  .dragbar .dock{margin-left:auto;font:500 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);background:none;border:1px solid var(--line);padding:4px 8px;cursor:pointer}
  .dragbar .dock:hover{color:var(--heading);border-color:var(--rule)}
  .coach .inner{flex:1;min-height:0;overflow:auto;padding:var(--s4) var(--s5)}
  .coach .keys{flex:0 0 auto;border-top:1px solid var(--line);padding:6px var(--s4);
    font:400 10.5px/1.6 var(--mono);color:var(--faint);display:flex;gap:12px;flex-wrap:wrap}
  .coach .keys b{color:var(--muted);font-weight:500}
  .coach .step{font:500 13px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .coach .lensname{font:500 13px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ember-text)}
  .coach h3{font:400 26px/1.28 var(--serif);color:var(--heading);margin:6px 0 var(--s3)}
  .coach p{font:400 17.5px/1.7 var(--serif);color:var(--text);margin-bottom:var(--s3)}
  .coach .cite{font:400 15px/1.6 var(--mono);color:var(--muted);border-left:2px solid var(--line);
    padding-left:var(--s3);margin-top:var(--s3)}
  .coach .nav{display:flex;gap:6px;align-items:center;margin-top:var(--s3);
    border-top:1px solid var(--line);padding-top:var(--s2);flex-wrap:wrap}
  .coach .nav .btn{height:36px;font-size:15px;padding:0 16px}
  .coach .dots{display:flex;gap:4px;margin-left:auto}
  .coach .dots i{width:9px;height:9px;background:var(--line);display:block;cursor:pointer}
  .coach .dots i.on{background:var(--ember)}
  .btn.solid{background:var(--ember);color:var(--bg);border-color:var(--ember)}
  .btn.solid:hover{color:var(--bg);opacity:.9}
  .plain{font:400 12.5px/1.6 var(--serif);color:var(--muted);padding:7px var(--s5);
    border-bottom:1px solid var(--line);background:var(--bg);flex:0 0 auto}
  .plain b{color:var(--heading);font-weight:400;font-style:italic}
  .framemark{display:block;font:400 9.5px/1.6 var(--mono);letter-spacing:.06em;color:var(--faint);margin-top:4px}
  /* journeys: where you stand, then the passages as lanes */
  .stands{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line);background:var(--surface);
    position:sticky;top:0;z-index:5}
  .stand{flex:1 1 150px;text-align:left;background:transparent;border:0;border-right:1px solid var(--line);
    padding:9px var(--s4) 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
  .stand:last-child{border-right:0}
  .stand .sk{font:500 9.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .stand .sn{font:400 14px/1.25 var(--serif);color:var(--heading)}
  .stand .sr{font:400 10.5px/1.5 var(--mono);color:var(--muted)}
  .stand:hover{background:var(--raised)}
  .stand[aria-pressed="true"]{background:var(--bg);box-shadow:inset 0 2px 0 var(--sun-coral)}
  .stand[aria-pressed="true"] .sk{color:var(--sun-coral)}
  .stand.cross{border-left:1px dashed var(--rule)}
  .standnote{font:400 10.5px/1.6 var(--mono);color:var(--faint);padding:6px var(--s5) 0}
  /* journeys: passages as lanes */
  .lane.focus{border-left-width:4px;background:var(--raised)}
  .lane.dim{opacity:.45}
  .lane{border:1px solid var(--line);border-left:2px solid var(--sun-coral);background:var(--surface);
    padding:10px var(--s4);margin:0 var(--s5) var(--s3);max-width:none}
  .lane .lh{font:500 10.5px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;
    color:var(--ember-text);margin-bottom:7px;display:flex;gap:10px;align-items:baseline}
  .lane .lh em{font-style:normal;color:var(--faint);margin-left:auto;font-size:10px}
  .seq{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
  .seq .st{font:500 10.5px/1 var(--mono);padding:5px 8px;border:1px solid;cursor:pointer;white-space:nowrap}
  .seq .arw{color:var(--faint);font-size:11px}
  .seq .st.reached{color:var(--sun-gold-t);border-color:var(--sun-gold-t)}
  .seq .st.stop{color:var(--warn);border-color:var(--warn);border-style:dashed}
  .seq .st.beyond{color:var(--faint);border-color:var(--line);opacity:.6}
  .seq .st:hover{background:var(--raised)}
  .lane .lc{font:400 11.5px/1.6 var(--mono);color:var(--muted);margin-top:7px}
  .lane .lc b{color:var(--warn);font-weight:500}
  /* treemap */
  .tm{position:absolute;overflow:hidden;border:1px solid var(--bg);padding:3px 6px;cursor:pointer}
  .tm span{font:400 10px/1.4 var(--mono);color:var(--tm-ink,var(--heading));display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tm:hover{outline:2px solid var(--heading);z-index:5}

  /* rows */
  .rows{padding:var(--s3) 0}
  .row{display:grid;gap:var(--s3);align-items:center;padding:7px var(--s5);cursor:pointer;border-left:2px solid transparent}
  .row:hover{background:var(--surface);border-left-color:var(--ember)}
  .row .title{font:400 13.5px/1.4 var(--serif);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .id{font:500 11px/1 var(--mono);color:var(--faint);letter-spacing:.04em}
  .lrow{grid-template-columns:70px 1fr 62px 96px}
  .crow{grid-template-columns:1fr}
  .tag{font:500 9.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border:1px solid;border-radius:2px;text-align:center}
  .t-open{color:var(--sun-blue-t);border-color:var(--sun-blue-t)}
  .t-anticipated{color:var(--sun-violet-t);border-color:var(--sun-violet-t)}
  .t-drafted{color:var(--sun-amber-t);border-color:var(--sun-amber-t)}
  .t-filed{color:var(--sun-gold-t);border-color:var(--sun-gold-t)}
  .cites{font:400 10px/1 var(--mono);color:var(--faint);text-align:right}

  .subhead{font:600 10.5px/1.5 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
    margin:var(--s5) var(--s5) var(--s3);padding-bottom:6px;border-bottom:1px solid var(--line)}
  .barline{display:grid;grid-template-columns:130px 1fr 54px;gap:var(--s3);align-items:center;padding:4px var(--s5);
    font:400 11.5px/1.5 var(--mono);color:var(--muted)}
  .barline .bar{height:9px;background:var(--inset);border:1px solid var(--line)}
  .barline .bar i{display:block;height:100%}
  .barline .n{text-align:right;color:var(--heading);font-variant-numeric:tabular-nums}
  .spark{display:flex;align-items:flex-end;gap:1px;height:54px;padding:0 var(--s5);margin-top:var(--s2)}
  .spark i{flex:1;background:var(--ember);opacity:.75;min-height:1px}
  .spark i:hover{opacity:1;background:var(--ember-text)}
  .caption{font:400 10px/1.5 var(--mono);color:var(--faint);padding:6px var(--s5) 0;display:flex;justify-content:space-between}
  .succ-row{display:grid;grid-template-columns:86px 1fr;gap:var(--s3);align-items:center;
 padding:2px var(--s5);cursor:pointer}
 .succ-row:hover{background:var(--surface)}
 .succ-row .id{font:500 10px/1 var(--mono);color:var(--faint);letter-spacing:.03em;text-align:right;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .succ-row.sel .id{color:var(--heading)}
 .succ-strip{display:flex;height:9px;background:var(--inset);border:1px solid var(--line)}
 .succ-strip i{display:block;height:100%;min-width:3px}
 .succ-axis{display:flex;justify-content:space-between;font:400 10px/1.5 var(--mono);color:var(--faint);
 padding:4px var(--s5) 0 calc(86px + var(--s3) + var(--s5))}
 @media (max-width:900px){body{overflow:auto}main{flex-direction:column}aside{width:auto}.lenses{flex-wrap:wrap}}
</style>
<script src="/assets/topbar.js" defer></script>
</head>
<body>
<div class="hudbar">
  <span class="mark">The Transducer</span>
  <span class="chip"><span class="dot"></span>focus mode</span>
  <span class="chip">Techne-Co-op/<b>techne.coop</b></span>
  <span class="chip">TRANSDUCER v0.2 &middot; <b>adopted 2026-08-17</b></span>
  <span class="chip">A1 succession &middot; <b>drafted, not adopted</b></span>
  <span class="chip" id="topcut">a dated cut of main &middot; read <b id="gen"></b> &middot; current only by re-reading</span>
  <span class="spacer"></span>
  <button class="btn solid" id="guidebtn">start here</button>
  <button class="btn" id="mode">light / dark</button>
</div>
<div class="band" id="band"></div>

<div class="lenses" role="tablist">
  <button class="lens" data-view="journeys" aria-pressed="true">
    <span class="k">00 &middot; where you stand</span><span class="t">Journeys</span>
    <span class="d">the landscape as a person walks it, from the stranger at the door to the patron member</span>
  </button>

omputed by hand from the record.","sec": "B \u00b7 The guild participant \u00b7 Class Three, virtual","sentence": "They can see their own path as a tally: days established, invitations standing, and what remains, with every figure tracing to the events that made it. The tally is self-facing and never comparative; eligibility is a condition, not a target, which is how this story and X-3 hold together.","state": "proposed","surface": "path tally"},"B-8": {"id": "B-8","note": "on adoption","proven": "cancellation lands as an event and the walkaway export carries their rows like any other.","sec": "B \u00b7 The guild participant \u00b7 Class Three, virtual","sentence": "They can cancel on reasonable notice, and their history remains in the record, correctable but never erased, exportable with everything else.","state": "proposed","surface": "the record"},"B-9": {"id": "B-9","note": "refusal set","proven": "every one of these refusals is asserted in the rehearsal for the guild persona, and the terms say the capital sentence in plain words.","sec": "B \u00b7 The guild participant \u00b7 Class Three, virtual","sentence": "They cannot vote, accrue no patronage allocation, hold no hub space, are never converted to membership automatically, and their dues are never capital, at any amount.","state": "proposed","surface": "terms \u00b7 probe matrix"},"C-1": {"id": "C-1","note": "level machinery","proven": "the join surface carries the level choice and a level change lands as an event; today enrollment lands without a level and no surface changes one, so the machinery is named here rather than claimed.","sec": "C \u00b7 The community participant \u00b7 Class Three, at the hub","sentence": "A community participant can enroll at the level that fits, Threshold, Footing, or Standing, and change levels on reasonable notice.","state": "drafted","surface": "/commons/join?way=community"},"C-2": {"id": "C-2","note": "P-03 persona","proven": "a community persona joins the rehearsal (P-03) and walks B-3 through B-6 with the same assertions; the machinery is live for members, but no class-scoped persona has walked it.","sec": "C \u00b7 The community participant \u00b7 Class Three, at the hub","sentence": "Once bound, they hold the same commons capabilities the guild stories name: a profile, gatherings, and the board.","state": "drafted","surface": "the commons"},"C-3": {"id": "C-3","note": "","proven": "","sec": "C \u00b7 The community participant \u00b7 Class Three, at the hub","sentence": "Hub space at Footing and above is the framework's promise about a room, not the record's; the system claims nothing about doors.","state": "live","surface": "the hub"},"C-4": {"id": "C-4","note": "P-03 refusals","proven": "the refusals hold in the rehearsal for the community persona, which arrives with P-03; until then the class-scoped assertion has not run.","sec": "C \u00b7 The community participant \u00b7 Class Three, at the hub","sentence": "They cannot vote and accrue no patronage allocation, exactly as the class provides.","state": "drafted","surface": "probe matrix"},"D-1": {"id": "D-1","note": "","proven": "the signature lands atomically and the execution date anchors the tracking clock.","sec": "D \u00b7 The co-working participant \u00b7 Class Two","sentence": "A co-working participant can read and sign the Hub Participation Agreement on the shelf, and their patronage tracking begins from first execution.","state": "live","surface": "/commons/agreements"},"D-2": {"id": "D-2","note": "Q3","proven": "the Q3 counting rules give contributions their rates and the tally shown equals the hand trace.","sec": "D \u00b7 The co-working participant \u00b7 Class Two","sentence": "They can see their credits accruing toward conversion, as a tally over recorded contributions.","state": "anticipated","surface": "patronage tally"},"D-3": {"id": "D-3","note": "tally on Q3","proven": "the threshold reads from the same tally the member sees, and the invitation lands as a recorded act.","sec": "D \u00b7 The co-working participant \u00b7 Class Two","sentence": "On reaching the board-set threshold, they may be invited to apply for membership, with the credits informing the invitation per Schedule A.","state": "drafted","surface": "Schedule A"},"D-4": {"id": "D-4","note": "refusal","proven": "the refusals hold in the rehearsal and the participation surfaces say so in plain words.","sec": "D \u00b7 The co-working participant \u00b7 Class Two","sentence": "They cannot vote, hold no capital account, and receive no Schedule K-1, because a desk is not a partnership.","state": "live","surface": "probe matrix"},"E-1": {"id": "E-1","note": "tally stub on Q3","proven": "admission lands as events and the capital tally, once the counting rules give it life, equals the hand trace.","sec": "E \u00b7 The cooperative member \u00b7 Class One, the patron","sentence": "An invited person can sign the Membership Agreement, pay the one-time share, and watch the capital account open at one hundred dollars as a view over events, never a stored balance.","state": "live","surface": "the record"},"E-10": {"id": "E-10","note": "steward-relayed","proven": "a Direction's whole life lands as events and the desk shows the arc, with the provenance pair on everything the run makes.","sec": "E \u00b7 The cooperative member \u00b7 Class One, the patron","sentence": "A member can direct the instrument: give it work as a recorded act with a brief, a kind, and a scope, watch the arc of it, and see its acceptance or refusal on the record.","state": "live","surface": "/intranet/direct"},"E-11": {"id": "E-11","note": "","proven": "","sec": "E \u00b7 The cooperative member \u00b7 Class One, the patron","sentence": "A member votes in meetings under the Bylaws; no surface carries ballots, and none pretends to.","state": "live","surface": "the Bylaws"},"E-12": {"id": "E-12","note": "tally on Q3","proven": "withdrawal lands as events and settlement reads from the same tally the member always saw.","sec": "E \u00b7 The cooperative member \u00b7 Class One, the patron","sentence": "A member can withdraw on fourteen days' notice, settle at the capital account balance, and know the record of their years remains intact, correctable but never erased.","state": "live","surface": "the record"},"E-2": {"id": "E-2","note": "","proven": "the shelf shows each instrument with version and standing, and signing is inline.","sec": "E \u00b7 The cooperative member \u00b7 Class One, the patron","sentence": "A member can always see every agreement that binds them, and can never be bound by something they cannot read.","state": "live","surface": "/commons/agreements"},"E-3": {"id": "E-3","note": "","proven": "the member persona walks every commons capability in the rehearsal.","sec": "E \u00b7 The cooperative member \u00b7 Class One, the patron","sentence": "A member sees the member-scoped commons whole: the directory, the calendar, the board, and the responses that concern them.","state": "live","surface": "the commons"},"E-4": {"id": "E-4","note": "","proven": "a hosted session's registration and attendance land as events under the host's hand.","sec": "E \u00b7 The cooperative member \u00b7 Class One, the patron","sentence": "A member can host: stand a gathering under a governing agreement, manage its sessions, and record attendance where the record counts it.","state": "live","surface": "/commons/gatherings"},"E-5": {"id": "E-5","note": "policy pending","proven": "the Desk's reads match the movement record and no write path exists before adoption.","sec": "E \u00b7 The cooperative member \u00b7 Class One, the patron","sentence": "A member can read the Desk: the governance record of every movement the rules care about, read-only until the treasury policy adopts.","state": "live","surface": "/intranet/treasury"},"E-6": {"id": "E-6","note": "","proven": "the roster's standing equals the standing folded by hand from adoption events.","sec": "E \u00b7 The cooperative member \u00b7 Class One, the patron","sentence": "A member can see the Programs view: each Program's purpose, its Coordinator, its policy standing, and how it recognizes work.","state": "live","surface": "/intranet/programs"},"E-7": {"id": "E-7","note": "Q3","proven": "Q3 is recorded and every figure traces to contribution events at the adopted rates.","sec": "E \u00b7 The cooperative member \u00b7 Class One, the patron","sentence": "A member can see their patronage and their distributive share as tallies, once the counting rules name the rates.","state": "anticipated","surface": "patronage \u00b7 capital tally"},"E-8": {"id": "E-8","note": "GUILD P-04","proven": "the verb refuses non-members and duplicates in the words of the rule, and the tally counts distinct inviters.","sec": "E \u00b7 The cooperative member \u00b7 Class One, the patron","sentence": "A member can invite an access-track participant toward membership as a recorded act, once per pair, and the invitation appears in that person's path tally.","state": "proposed","surface": "invitation verb"},"E-9": {"id": "E-9","note": "STANDING \u00b7 P-05","proven": "the carrier act lands as its own event citing the designation, and its floor asserts active membership at the moment of the act.","sec": "E \u00b7 The cooperative member \u00b7 Class One, the patron","sentence": "A member can bring a body of work forward and stand as its carrier by a recorded act beside the designation, toward Program standing today and Venture standing when that module adopts; designation itself stays name and purpose only, exactly as F-4 provides.","state": "proposed","surface": "designation"},"F-1": {"id": "F-1","note": "","proven": "each act lands under the steward's grant and its Authority Map cell, and nothing lands without one.","sec": "F \u00b7 The roles \u00b7 grants, not titles","sentence": "The steward hears every application, binds sign-ins to agents, records lifecycle transitions, and relays the instrument's marks while the first grant stands undecided.","state": "live","surface": "role grants"},"F-2": {"id": "F-2","note": "","proven": "the probe asserts the host scope against its cell.","sec": "F \u00b7 The roles \u00b7 grants, not titles","sentence": "A host manages their own gathering's sessions and attendance, and nobody else's.","state": "live","surface": "/commons/gatherings"},"F-3": {"id": "F-3","note": "verbs on Q3","proven": "recognition writes carry the policy's citation and refuse outside its bounds.","sec": "F \u00b7 The roles \u00b7 grants, not titles","sentence": "A Coordinator recognizes work within their Program by its ratified policy, and only within it.","state": "drafted","surface": "/intranet/programs"},"F-4": {"id": "F-4","note": "","proven": "designation refuses all other hands in the words of the rule, as it did for both principal Programs.","sec": "F \u00b7 The roles \u00b7 grants, not titles","sentence": "The steward or a director can designate a Program by the verb, carrying name and purpose only, with substance arriving by policy.","state": "live","surface": "designation"},"F-5": {"id": "F-5","note": "","proven": "the probe matrix walks every role against every table on every change.","sec": "F \u00b7 The roles \u00b7 grants, not titles","sentence": "Overseers hold broad read by dated grant, and a revoked grant closes the door the same day it is cut.","state": "live","surface": "probe matrix"},"G-1": {"id": "G-1","note": "","proven": "the provenance pair stands on every artifact and its absence on standing duties is itself legible.","sec": "G \u00b7 The instrument \u00b7 capabilities without authority","sentence": "Under a member's Direction, the instrument drafts, surfaces, and proposes, and everything a run makes carries two hands: authored by the instrument, directed by the member.","state": "live","surface": "/intranet/direct"},"G-2": {"id": "G-2","note": "refusal","proven": "every adoption in the history shows a human act, and no record or policy traces to an instrument's hand alone.","sec": "G \u00b7 The instrument \u00b7 capabilities without authority","sentence": "The instrument cannot merge, adopt, sign, or decide, and its refusals speak in the words of the rule that refuses.","state": "live","surface": "Law X"},"G-3": {"id": "G-3","note": "the first grant","proven": "the organizers answer the first grant, either way, as a decision record.","sec": "G \u00b7 The instrument \u00b7 capabilities without authority","sentence": "Whether the instrument may hold one scoped authority, recording its own acceptances and refusals in the direction namespace alone, is staged as a question, not taken.","state": "proposed","surface": "AGY &sect;5"},"H-1": {"id": "H-1","note": "refusal","proven": "","sec": "H \u00b7 Sharing a project, class by class","sentence": "A project is a body of work before the record knows it, and nothing at the origin confers standing: no amount of posting, responding, or resolving makes a body of work something the record will vouch for. Only an adopted instrument does that.","state": "live","surface": "STANDING P3 \u00b7 R1"},"H-2": {"id": "H-2","note": "","proven": "the author's post, its responses, and its resolution land as events under the board's lifecycle, with the write refusing any hand but the author's and any status but active membership.","sec": "H \u00b7 Sharing a project, class by class","sentence": "A cooperative member can bring a project forward today: post it to the board as play, practice, or work, read the responses that concern them, and close it saying what it led to.","state": "live","surface": "/commons/opportunities"},"H-3": {"id": "H-3","note": "GUILD \u00b7 B-5","proven": "a guild participant's post, response, and resolution land under the same lifecycle as a member's, asserted for the guild persona rather than inferred from the member's walk.","sec": "H \u00b7 Sharing a project, class by class","sentence": "A guild participant can do exactly the same, from anywhere, on the day they enroll, which is the whole point of a virtual way in and the first thing a person will reach for.","state": "proposed","surface": "the board"},"H-4": {"id": "H-4","note": "P-03 persona","proven": "the community persona walks it in the rehearsal (P-03); today the policies key on an active membership and not on a class, so the capability is real and its class scoping is unasserted.","sec": "H \u00b7 Sharing a project, class by class","sentence": "A community participant holds the same board capability once bound, on the same terms as any other bound participant.","state": "drafted","surface": "the board"},"H-5": {"id": "H-5","note": "refusal","proven": "the probe matrix asserts the anonymous and applicant refusals against their Authority Map cells, on every change.","sec": "H \u00b7 Sharing a project, class by class","sentence": "A stranger can neither share a project nor read one: the board is not a public feed, and the rows never leave the database.","state": "live","surface": "probe matrix"},"H-6": {"id": "H-6","note": "internal end","proven": "the roster's standing equals the standing folded by hand from adoption events; work moving between ends, or adding the second, is the other family's instrument adopting, and there is no crossing verb.","sec": "H \u00b7 Sharing a project, class by class","sentence": "A project becomes something the record can prove only by gaining a standing, and a standing is conferred by an adopted instrument, never by activity: Program standing today by designation and ratified policy, Venture standing when the standing module adopts and its instruments exist.","state": "live","surface": "STANDING P1 \u00b7 P4"},"H-7": {"id": "H-7","note": "STANDING \u00b7 P-05","proven": "the carrier act lands as its own event citing the designation, its floor asserting active membership at the moment of the act, exactly as E-9 provides and F-4 constrains.","sec": "H \u00b7 Sharing a project, class by class","sentence": "A member can stand as a project's carrier by a recorded act beside the designation, which is how a person's name attaches to a body of work without the record inventing an object for the work itself.","state": "proposed","surface": "designation"},"H-8": {"id": "H-8","note": "STANDING-D6","proven": "the board records STANDING-D6 either way. On either answer the origin still confers nothing; if the answer is yes, the same election names whose hand may name a project, since that is a new write path and it needs its own authority cell.","sec": "H \u00b7 Sharing a project, class by class","sentence": "Whether the record may know a project by name, so that several opportunities can be said to belong to one body of work, is an open election and not a builder's choice. The standing module's first draft answered no; the steward's challenge of 2026-08-10, that no member and no board had ever decided it, was correct, so the answer was withdrawn and the question staged in its place.","state": "proposed","surface": "STANDING &sect;4 \u00b7 &sect;10"},"X-1": {"id": "X-1","note": "","proven": "the append-only trigger refuses every update and delete, and every tally traces.","sec": "X \u00b7 Every participant, whatever the class","sentence": "Nothing about you is a stored label: your standing is computed from what happened, corrections stay visible beside their mistakes, and history is not editable, for anyone.","state": "live","surface": "the record"},"X-2": {"id": "X-2","note": "","proven": "a policy without an anchor cannot merge and the anchors re-verify at the proof.","sec": "X \u00b7 Every participant, whatever the class","sentence": "Every right a page claims can be traced to the instrument that grants it, and every permission the database enforces carries its Bylaws anchor.","state": "live","surface": "authority map"},"X-3": {"id": "X-3","note": "","proven": "no surface renders a comparative figure of persons, and the guard holds in review; the path tally of B-7 stays self-facing, a condition shown to its own person, never a ranking.","sec": "X \u00b7 Every participant, whatever the class","sentence": "No score, rank, or leaderboard represents you anywhere, at any class or any amount, and no measure of participation is made into a target.","state": "live","surface": "every surface"},"X-4": {"id": "X-4","note": "","proven": "authentication completes by magic link alone and binding resolves who is asking.","sec": "X \u00b7 Every participant, whatever the class","sentence": "Sign-in is a link to your inbox; there is no password anywhere in the system to forget or to steal.","state": "live","surface": "sign-in"},"X-5": {"id": "X-5","note": "","proven": "export, fresh restore, and re-export agree byte for byte, with the tally exactly reconstructed.","sec": "X \u00b7 Every participant, whatever the class","sentence": "If the platform vanished tomorrow, the record would not: the cooperative rehearses leaving every week, and has done it live.","state": "live","surface": "the walkaway"}}},"ledger": [{"bed": "series","cites": 0,"id": "SER","intent": "The covering document of the refactor, including itself.","mark": "drafted","ready": "","status": "drafted","title": "Series Overview"},{"bed": "series","cites": 1,"id": "PRD","intent": "Deprecation record, four capabilities, three doors, ten principles.","mark": "drafted","ready": "","status": "drafted","title": "Product Requirements v0.4"},{"bed": "series","cites": 2,"id": "BP","intent": "One operating contract, piece ledger grammar, decisions and stop cards, provenance. Yields AGENTS.md.","mark": "drafted","ready": "","status": "drafted","title": "Build Protocol"},{"bed": "series","cites": 2,"id": "UI","intent": "Design tokens and patterns aligned to techne.coop/design-system. Yields commons.css.","mark": "drafted","ready": "","status": "drafted","title": "Tokens and Patterns"},{"bed": "series","cites": 2,"id": "IM","intent": "Information model and the eleven laws. Yields 0001_substrate.sql.","mark": "drafted","ready": "","status": "drafted","title": "Information Model"},{"bed": "series","cites": 3,"id": "VS","intent": "Five suites and six proofs. Yields verify.yml.","mark": "drafted","ready": "","status": "drafted","title": "Verification Spec"},{"bed": "series","cites": 3,"id": "AM","intent": "Authority map anchored in Bylaws v2.1. Yields 0002_policies.sql.","mark": "drafted","ready": "","status": "drafted","title": "Authority Map"},{"bed": "series","cites": 6,"id": "PATRONAGE","intent": "Programs as organizing bodies for Opportunities; the event contract for contributions, claims, and the allocation sequence; configuration as record; the Programs view. Yields, anticipated, 000N_patronage_verbs.sql. Proposal posture per its own \u00a71; nothing adop","mark": "drafted","ready": "","status": "drafted","title": "Program Patronage \u00b7 Module PRD and Specification"},{"bed": "series","cites": 7,"id": "TREASURY","intent": "The movement layer over Stripe, Mercury, and Xero; governed movements as events; the two-person signature discipline as record; reconciliation as a tally; the four joint contracts with PATRONAGE. Yields, anticipated, 000N_treasury_verbs.sql. Proposal posture p","mark": "drafted","ready": "","status": "drafted","title": "Treasury \u00b7 Module PRD and Specification"},{"bed": "series","cites": 8,"id": "AGY","intent": "Patron members direct the cooperative's agent on the record: the direction rail, the run, provenance under two hands, the desk, the floor, and the first-grant decision, staged and routed. Yields, anticipated, 000N_direction_rail.sql. Proposal posture per its o","mark": "drafted","ready": "","status": "drafted","title": "Common Agency \u00b7 Module PRD and Specification"},{"bed": "series","cites": 6,"id": "PUB","intent": "A proposed module for member-authored writing published inside the cooperative: the entry, the named peer's reading, standing carried by events, versions rather than edits, and a register beside the Almanac. A reading attests that the ivered","title": "The generator"},{"bed": "transducer","cites": 2,"id": "TR-03","intent": "The generator wired into continuous integration on merge to main, with the \u00a75 audit: fail if the embedded cut is older than the commit it sits beside, on the X-10 pattern. The gate's own refresh commits are marked and the generator ignores them, and the page's","mark": "delivered","ready": "TR-02 verified.","status": "open \u00b7 delivered","title": "The currency gate"},{"bed": "transducer","cites": 3,"id": "TR-04","intent": "The page standing at its elected address inside the shell, five views, chips per the constitution, the merge stamped on every view. Interim address /intranet/hud/, intranet only and noindex, per the TRANSDUCER-D2 default until the board elects.","mark": "delivered","ready": "TR-03 verified; TRANSDUCER-D2 recorded.","status": "open \u00b7 delivered","title": "The surface, deployed"},{"bed": "transducer","cites": 1,"id": "TR-05","intent": "View 03 reads the journeys register instead of parsing the stories page, and drops the notice that half its derivation is a promise. The parser is deleted rather than kept as a fallback.","mark": "anticipated","ready": "The journeys register verified, JOURNEYS J-02 in the module document's own numbering; that module is not yet grafted and this ledger mints nothing for it here.","status": "anticipated","title": "The journeys derivation"},{"bed": "transducer","cites": 2,"id": "TR-06","intent": "The guest layer's definitions read from the Lexicon as a source rather than carried as a copy, each citing its section.","mark": "anticipated","ready": "TR-02 verified.","status": "anticipated","title": "The gloss binding"},{"bed": "transducer","cites": 1,"id": "TR-07","intent": "Every interpretive sentence marked as the instrument's reading per \u00a77, or struck, per the recorded election. The interim mark on the drafted artifact prejudges nothing.","mark": "anticipated","ready": "TRANSDUCER-D4 recorded.","status": "anticipated","title": "The attribution pass"},{"bed": "transducer","cites": 2,"id": "TR-08","intent": "The guest layer of \u00a78 as a maintained piece rather than an accident of the artifact: seven cards in the Commonplace register with their entry citations, the docked and draggable card, the target marking graded to the size of the target, and the key pattern, so","mark": "delivered","ready": "TR-04 verified; TRANSDUCER-D5 recorded.","status": "open \u00b7 delivered","title": "The walk"},{"bed": "transducer","cites": 2,"id": "TR-09","intent": "The generator walks every revision of the ledger, recovers each piece's observed states in order under the discipline of A1 section 3, and writes them into the cut. Every distinct state a piece is observed to hold, including several on one date, in the order o","mark": "delivered","ready": "TR-02 verified.","status": "open \u00b7 delivered","title": "The succession derivation"},{"bed": "transducer","cites": 3,"id": "TR-10","intent": "The succession view inside the shell, marks per the colour law of A1 section 6, the revision count named on the surface per A1 section 5. Dwell is elapsed days and never an alarm, per R7: no threshold at which a piece becomes late, because there is no promise ","mark": "delivered","ready": "TR-09 verified; TR-04 verified.","status": "open \u00b7 delivered","title": "The seam"},{"bed": "transducer","cites": 3,"id": "TR-11","intent": "The lens rail was ordered by the layers the instrument is built from, the file, the record, the commit, and it opened on the cross-section. That is the order a builder reads and not the order a member reads. This piece reorders the views by their legibility to","mark": "delivered","ready": "TR-04 delivered; the journeys lens on the surface.","status": "open \u00b7 delivered","title": "The landscape a person can find themselves in"},{"bed": "horizon","cites": 1,"id": "MM","intent": "The cooperative's possible growth stated twice, in two registers. The companion page says in plain words that a legal entity is a container and not an identity, and sketches three stages: the partnership that exists, a sibling cooperative for ventures, and a p","mark": "drafted","ready": "","status": "drafted","title": "Maturity Model 0.2 and its companion"},{"bed": "horizon","cites": 1,"id": "MM-01","intent": "The two pages placed at their canonical paths and a Horizon section entered on /legal/, carrying both under a note that says what they are not. Placed after the analysis group, so a reader meets the instruments, then their readings, then the model, in that ord","mark": "delivered","ready": "","status": "open \u00b7 delivered","title": "The horizon enters the shelf"},{"bed": "horizon","cites": 3,"id": "U-23","intent": "The launch passed and the hero still counted toward it, zeros forever under a label that said counting toward. The steward asked, from the Philosoraptor summit, for a rebuilt home page whose hero and sub-sections draw from the most intuitive parts of the commu","mark": "delivered","ready": "the steward's ask of 2026-08-17 in the philosoraptor-summits channel, carrying the launch-gathering transcript as source.","status": "open \u00b7 delivered","title": "The front door after the doors opened"},{"bed": "horizon","cites": 2,"id": "U-24","intent": "The rebuilt front door of U-23 used the sunset range well, and nothing said what well meant. The steward asked, from the Philosoraptor summit, for the aesthetic taken further and the system to say so: the sunset used consistently and in refined ways, a Southwe","mark": "delivered","ready": "the steward's ask of 2026-08-18 in the philosoraptor-summits channel; U-23 staged, which this branch builds on.","status": "open \u00b7 delivered","title": "The sunset written down, and the desert register"},{"bed": "horizon","cites": 5,"id": "U-25","intent": "The launch passed, the front door was recut, and the design system learned to say what it was doing; the estate still had no page answering the question anticipated","title": "The frame as a piece"},{"bed": "matrix","cites": 3,"id": "M-02","intent": "Stage 2: the append-only edge citing an event, a cell, and a voucher, with the write-time refusals of MATRIX \u00a76 and the fold of \u00a77. The Ground already holds events and tallies, so the piece is small; what it must prove is the fold, not the storage. It also set","mark": "anticipated","ready": "M-01 stands; the edge visibility default decided by the steward, since it cannot be decided after the first edge is written.","status": "anticipated","title": "The typed vouch as an event type"},{"bed": "matrix","cites": 3,"id": "M-03","intent": "Stage 3: a view reading the graph as edges rather than scores, showing its receipts, every count presented beside the edges it counts. TRANSDUCER v0.2 already has the shape; the current state of that instrument is unverified by MATRIX and the check belongs to ","mark": "anticipated","ready": "M-02 verified; TRANSDUCER adopted and its state read.","status": "anticipated","title": "A transducer over the graph"},{"bed": "matrix","cites": 2,"id": "M-04","intent": "Stage 4, last on purpose: reading past events against the marks. Doing this before the frame is adopted would be the agent computing standings about real people from its own reading, which is the one thing this bed exists to refuse. The piece is filed so that ","mark": "anticipated","ready": "M-03 verified; people are reading real edges and say the reading is useful; a person, not the agent, authorises the coding.","status": "anticipated","title": "Coding actual behaviour"},{"bed": "matrix","cites": 2,"id": "M-05","intent": "Stage 5, optional and separable: the attestation-layer bridge and the arbiter role of MATRIX \u00a713, taken at the verdicts in force. The scoring layer of the attestation project is out of scope entirely, and the arbiter role is capped at mark 4 exchange and below","mark": "anticipated","ready": "M-02 verified; the hidden RegenHub attestation network explained by its owners; a human decision taken on publishing edges to a public chain, which has no undo.","status": "anticipated","title": "The external bridges"},{"bed": "matrix","cites": 1,"id": "SMS-01","intent": "The plan at issue #191 lays out the phone channel in tiers, steward-only through member-with-passkey. This piece is the floor tier: the co-op number answered by Nou, from the steward's number only, read-only, over SMS. The Buzz seat's owner-only allowlist is t","mark": "verified","ready": "A2P 10DLC cleared for the line, verified 2026-08-22; the round trip proved end to end from the steward's number the same day.","status": "open \u00b7 verified","title": "The steward's phone line answered by Nou"},{"bed": "matrix","cites": 2,"id": "SMS-02","intent": "The phone plan's second tier, designed before it is built: a member proves in one ceremony that they hold a phone number and that they hold their Nostr key, the proof becomes a binding row in the CIS, and from then on that number's texts arrive in a dedicated ","mark": "drafted","ready": "Design only; nothing runs. The build that follows waits on the phone_bindings stop card (schema against the live CIS, a named human) and on direction for the li","status": "drafted","title": "Verified phone bindings to private Buzz channels"},{"bed": "matrix","cites": 3,"id": "SMS-03","intent": "The build the SMS-02 design gated on human acts, taken up the same night the design merged: the steward lifted the stop card and directed the build (DM, 2026-08-23 04:07 UTC). The phone_bindings table is minted with its two scoped roles, the quo-relay grows th","mark": "come","ready": "The stop card lifted by the steward's named authorization of 2026-08-23; the widening bounded to bindings whose ceremony the steward can audit end to end in pho","status": "open \u00b7 come","title": "The binding ceremony built and the line widened by proof"},{"bed": "matrix","cites": 3,"id": "SMS-04","intent": "A defect found while walking SMS-03's <script>
const $=s=>document.querySelector(s);
const SNAP=JSON.parse($('#snapshot').textContent), S=SNAP.stats;
const state={view:'journeys',filter:null,ring:null,persona:null};
const TINT={standing:'var(--sun-gold)',code:'var(--sun-blue)',ledger:'var(--sun-violet)',journeys:'var(--sun-coral)',hands:'var(--sun-amber)',succession:'var(--sun-rose)'};

/* mode: follow the device, allow override - as the estate's shell does */
const html=document.documentElement;
html.dataset.mode = matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
$('#mode').onclick=()=>{html.dataset.mode=html.dataset.mode==='dark'?'light':'dark';render();};
$('#gen').textContent=SNAP.generated;

/* the band: daily commit rhythm across the repo's whole life, in the sunset range */
(function(){
  const days=Object.keys(S.daily).sort(), max=Math.max(...Object.values(S.daily));
  const stops=['var(--sun-blue)','var(--sun-violet)','var(--sun-rose)','var(--sun-coral)','var(--sun-amber)','var(--sun-gold)'];
  const b=$('#band');
  days.forEach((d,i)=>{
    const n=S.daily[d], el=document.createElement('span');
    el.style.background=stops[Math.min(stops.length-1,Math.floor(6*n/max))];
    el.style.opacity=0.25+0.75*(n/max);
    el.title=d+' · '+n+' commits';
    b.appendChild(el);
  });
})();

document.querySelectorAll('.lens').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.lens').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true'); state.view=b.dataset.view; state.filter=null; state.ring=null; state.persona=null; render();
});

const fmtB=n=>n>1e6?(n/1e6).toFixed(2)+' MB':n>1e3?(n/1e3).toFixed(1)+' kB':n+' B';
const esc=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
function metrics(list){
  $('#overview').innerHTML=list.map(m=>`<div class="metric"><div class="l">${m.l}</div><div class="v num">${m.v}</div><div class="q">${m.q}</div></div>`).join('');
}
function render(){
  html.style.setProperty('--cis-tint',TINT[state.view]);
  if(typeof PLAIN!=='undefined') $('#plain').innerHTML=PLAIN[state.view]||'';
  const c=$('#canvas'); c.innerHTML='';
  if(state.view==='standing') viewStanding(c);
  if(state.view==='code') viewCode(c);
  if(state.view==='ledger') viewLedger(c);
  if(state.view==='journeys') viewJourneys(c);
  if(state.view==='hands') viewHands(c);
  if(state.view==='succession') viewSuccession(c);
}


/* ============ 01 · STANDING · the whole ============
   Not a fourth instrument. The three lenses each look THROUGH a
   medium - the file, the record, the commit - and are blind outside
   it. This one has no medium: it is the trunk cut across, so the
   dimensions can disagree with each other in one figure.
   Rings after the Stasis prototype (techne.coop, drafted not adopted). */
const NS='http://www.w3.org/2000/svg';
const PROOFS=['G0','G-B','G-G','G-F','G-S','G-T','G-R','G-A','G-L','G-V'];
const WOOD_SKIP=['series','proofs'];
function sel(tag,at,parent){const n=document.createElementNS(NS,tag);
  for(const k in at) n.setAttribute(k,at[k]); if(parent)parent.appendChild(n); return n;}
const PT=(cx,cy,r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
function sectorPath(cx,cy,r0,r1,a0,a1){
  const big=(a1-a0)>Math.PI?1:0;
  const [x0,y0]=PT(cx,cy,r1,a0),[x1,y1]=PT(cx,cy,r1,a1);
  const [x2,y2]=PT(cx,cy,r0,a1),[x3,y3]=PT(cx,cy,r0,a0);
  return `M${x0},${y0}A${r1},${r1} 0 ${big} 1 ${x1},${y1}L${x2},${y2}A${r0},${r0} 0 ${big} 0 ${x3},${y3}Z`;
}
const RING_NODES={};
function viewStanding(c){
  const L=SNAP.ledger, St=SNAP.stats;
  const instruments=L.filter(i=>i.status==='drafted');
  const proofs=PROOFS.map(id=>L.find(i=>i.id===id)).filter(Boolean);
  const attested=proofs.filter(p=>markOf(p)==='attested').length;
  const beds=St.beds.filter(([b])=>!WOOD_SKIP.includes(b));
  const verified=L.filter(i=>markOf(i)==='verified').length;

  metrics([
    {l:'the record',v:St.commits,q:'commits, append-only, since '+St.first},
    {l:'the instruments',v:instruments.length,q:'governing documents, all drafted'},
    {l:'the wood',v:beds.length,q:'beds of work'},
    {l:'verified',v:verified+'/'+L.length,q:'acceptance walked by a person'},
    {l:'the proofs',v:attested+'/'+proofs.length,q:'attested under two hands'},
    {l:'the estate',v:St.ext.find(e=>e[0]==='html')[1],q:'pages published from main'}
  ]);
  $('#reading').innerHTML=`Read heart outward: the commit log at the centre, the governing documents as the ring that binds and changes slowest, each bed a sector of living wood filled by how far its pieces came, the proofs as caps on the growing edge, and the published estate as the bark it all grows toward. <b>The instruments ring is entirely drafted and the proof ring is one of ten</b> - the two rings that need people, rather than building, are the two that have not closed.<span class="framemark">figures computed from the record; the framing is the instrument\u2019s reading, drafted not adopted</span>`;

  const disc=document.createElement('div'); disc.className='disc';
  const svg=sel('svg',{role:'application','aria-label':'The repository cut across the grain: the commit log at the heart, the governing documents, the beds as sectors, the proofs, and the published estate at the rim.'},disc);
  c.appendChild(disc);
  disc.insertAdjacentHTML('beforeend','<div class="dischint">click a ring to open it &middot; W and S walk outward and in &middot; esc releases</div>');

  const w=c.clientWidth||900, h=c.clientHeight||520;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const cx=w/2, cy=h/2, M=Math.min(w/2-46,h/2-30);
  const R={heart:M*.14, iIn:M*.19, iOut:M*.28, bIn:M*.34, bOut:M*.78, proof:M*.865, bark:M*.95};
  const under=sel('g',{},svg), rings=sel('g',{},svg);
  [R.iIn,R.iOut,R.bIn,R.bOut].forEach(r=>sel('circle',{cx,cy,r,class:'ringrule'},under));
  sel('circle',{cx,cy,r:R.bark,class:'ringrule dashed'},under);

  const order=[];
  function node(key,label,parent){
    const g=sel('g',{class:'rnode',tabindex:0,role:'button','aria-label':label},parent);
    RING_NODES[key]=g; order.push(key);
    g.addEventListener('click',()=>pick(key===state.ring?null:key));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(key===state.ring?null:key);}});
    return g;
  }

  /* heart - the record */
  (function(){
    const g=node('heart','The heart: the commit log',rings);
    sel('circle',{cx,cy,r:R.heart+5,class:'halo'},g);
    sel('circle',{cx,cy,r:R.heart,class:'heartc'},g);
    const t=sel('text',{x:cx,y:cy+3,'text-anchor':'middle','font-size':Math.max(7.5,R.heart*.2),
      style:'letter-spacing:.06em'},g);
    t.textContent='the log';
  })();

  /* ring one - the instruments */
  (function(){
    const n=instruments.length, span=Math.PI*2/n, gap=.014;
    instruments.forEach((inst,i)=>{
      const a0=-Math.PI/2+i*span+gap, a1=a0+span-gap*2;
      const g=node('inst:'+inst.id,'Instrument '+inst.id+', drafted',rings);
      sel('path',{d:sectorPath(cx,cy,R.iIn-3,R.iOut+3,a0,a1),class:'halo'},g);
      sel('path',{d:sectorPath(cx,cy,R.iIn,R.iOut,a0,a1),style:'fill:var(--ember);opacity:.72'},g);
      /* the ring is shallow, so a label can only run along its arc. Fourteen
         sectors at this radius give ~23px each: an abbreviation that short is
         noise, not a name, and adjacent ones collide into a smear. Draw the
         label only where the whole id genuinely fits; elsewhere the sector
         stays anonymous and is named by its aria-label, its tooltip, and the
         detail panel it opens. */
      const rm=(R.iIn+R.iOut)/2, am=(a0+a1)/2, [lx,ly]=PT(cx,cy,rm,am);
      const fs=Math.max(7.5,M*.026);
      const arc=rm*(a1-a0);
      sel('title',{},g).textContent=inst.id+' · drafted';
      if(inst.id.length*fs*.62<=arc*.92){
        let deg=am*180/Math.PI+90; if(deg>90&&deg<270) deg-=180;
        const t=sel('text',{x:lx,y:ly,'text-anchor':'middle','dominant-baseline':'central',
          'font-size':fs,transform:`rotate(${deg},${lx},${ly})`},g);
        t.textContent=inst.id;
      }
    });
    const lt=sel('text',{x:cx,y:cy-R.iOut-5,'text-anchor':'middle','font-size':7,class:'ringname'},under);
    lt.textContent='the instruments';
  })();

  /* the wood - beds as sectors, filled by mark */
  (function(){
    const n=beds.length, span=Math.PI*2/n, gap=.012, depth=R.bOut-R.bIn;
    const fill=LADDER.concat(OFF);
    beds.forEach(([bed,count],i)=>{
      const a0=-Math.PI/2+i*span+gap, a1=a0+span-gap*2, am=(a0+a1)/2;
      const g=node('bed:'+bed,'Bed '+bed,rings);
      sel('path',{d:sectorPath(cx,cy,R.bIn-3,R.bOut+3,a0,a1),class:'halo'},g);
      const pieces=L.filter(x=>x.bed===bed);
      let r=R.bIn;
      fill.forEach(s=>{
        const k=pieces.filter(x=>markOf(x)===s.k).length; if(!k) return;
        const r2=r+depth*(k/(pieces.length||1));
        sel('path',{d:sectorPath(cx,cy,r,r2,a0,a1),
          style:`fill:${s.c};opacity:${s.k==='anticipated'?.34:.85}`},g);
        r=r2;
      });
      const [lx,ly]=PT(cx,cy,(R.bIn+R.bOut)/2,am);
      let deg=am*180/Math.PI; const flip=(deg>90||deg<-90);
      const bfs=Math.max(8,M*.03), bdepth=R.bOut-R.bIn-6;
      const t=sel('text',{x:lx,y:ly,'text-anchor':'middle','dominant-baseline':'central',
        'font-size':bfs,transform:`rotate(${flip?deg+180:deg},${lx},${ly})`},g);
      const bl=bed.replace('_','-'), bmax=Math.max(3,Math.floor(bdepth/(bfs*.62)));
      t.textContent=bl.length>bmax?bl.slice(0,bmax-1)+'…':bl;
    });
  })();

  /* the cambium - the proofs */
  (function(){
    const n=proofs.length;
    proofs.forEach((p,i)=>{
      const a=-Math.PI/2+(i+.5)/n*Math.PI*2, [x,y]=PT(cx,cy,R.proof,a);
      const g=node('proof:'+p.id,'Proof '+p.id+', '+markOf(p),rings);
      sel('circle',{cx:x,cy:y,r:9,class:'halo'},g);
      sel('circle',{cx:x,cy:y,r:4.6,class:markOf(p)==='attested'?'capA':'capN'},g);
      const [tx,ty]=PT(cx,cy,R.proof+13,a);
      const t=sel('text',{x:tx,y:ty,'text-anchor':'middle','dominant-baseline':'central','font-size':8},g);
      t.textContent=p.id;
    });
  })();

  /* the bark - the published estate */
  (function(){
    const g=node('bark','The bark: the published estate',rings);
    sel('circle',{cx,cy,r:R.bark,class:'halo'},g);
    const t=sel('text',{x:cx,y:cy-R.bark-12,'text-anchor':'middle',
      'font-size':Math.max(11,M*.052),class:'barkword'},g);
    t.textContent='techne.coop';
    const s2=sel('text',{x:cx,y:cy+R.bark+16,'text-anchor':'middle','font-size':7,class:'ringname'},g);
    s2.textContent='the published estate \u00b7 read of '+SNAP.generated;
  })();

  state._order=order;
  applyRing();
}

  const HEX={html:'#5476B8',sql:'#6E5494',py:'#D1755A',js:'#D1755A',md:'#E09A52',
    yaml:'#EAB668',yml:'#EAB668',json:'#D1755A',css:'#D1755A',svg:'#6E5494',

}

/* ============ 02 · MATURATION · the work ============ */
/* The ledger's own mark grammar, per rdm-ledger.yaml's header (X-19, 2026-08-13):
   drafted = an unadopted document · anticipated = before anyone takes it up ·
   open · (mark) once taken up, where the mark is in-session, delivered (merged
   to main), verified (a person walked its acceptance), attested (a proof under
   two hands), or the condition the piece waits on. */
/* c fills shapes; t is the text-safe variant, the estate convention defined in
   the site shell (see index.html and commons/index.html) - never paint text with c */
const LADDER=[
  {k:'anticipated', c:'var(--sun-blue)',   t:'var(--sun-blue-t)',   say:'before anyone takes it up'},
  {k:'in-session',  c:'var(--sun-violet)', t:'var(--sun-violet-t)', say:'an agent is working it'},
  {k:'delivered',   c:'var(--sun-rose)',   t:'var(--sun-rose-t)',   say:'merged to main'},
  {k:'verified',    c:'var(--sun-amber)',  t:'var(--sun-amber-t)',  say:'a person walked its acceptance'},
  {k:'attested',    c:'var(--sun-gold)',   t:'var(--sun-gold-t)',   say:'a proof under two hands'}
];
const OFF=[
  {k:'drafted',  c:'var(--ember)', t:'var(--ember-text)', say:'an unadopted document - binds nothing'},
  {k:'waiting',  c:'var(--sun-coral)', t:'var(--sun-coral-t)', say:'open, naming the condition it waits on'}
];
const NAMED=new Set(LADDER.map(x=>x.k).concat(['drafted']));
const markOf=i=> i.status==='drafted' ? 'drafted'
  : NAMED.has(i.mark) ? i.mark : (i.status.startsWith('open')?'waiting':i.mark);
